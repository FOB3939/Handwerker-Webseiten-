<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1020}
#bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(30px) brightness(.45) saturate(1.2)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,25,.85) 0%,rgba(5,10,25,.2) 30%,rgba(5,10,25,.2) 70%,rgba(5,10,25,.9) 100%)}
#chip{position:absolute;top:300px;left:0;right:0;text-align:center}
#chip span{display:inline-block;font:800 34px Montserrat;letter-spacing:.12em;color:#0b1020;padding:10px 26px;border-radius:40px}
#t{position:absolute;top:380px;left:40px;right:40px;text-align:center;font:700 128px Oswald;line-height:1;text-transform:uppercase;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6)}
#card{position:absolute;left:90px;right:90px;top:700px;height:720px;border-radius:40px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:6px solid rgba(255,255,255,.9);display:flex}
#card div{flex:1;background-size:1080px auto;background-repeat:no-repeat}
#card .lab{position:absolute;top:18px;font:700 44px Oswald;padding:4px 18px;border-radius:12px;color:#fff}
#brand{position:absolute;top:1470px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px}
#brand img{width:110px;height:110px;border-radius:50%}
#brand span{font:800 44px Montserrat;color:#fff}
</style><script src="jobs/covers/data.js"></script></head><body>
<div id="bg"></div><div id="shade"></div><div id="chip"><span></span></div><div id="t"></div><div id="card"></div>
<div id="brand"><img src="assets/logo.png"><span>fob-fm.de</span></div>
<script>
function show(i){const P=PAGES[i];document.getElementById('bg').style.backgroundImage=`url(${P.imgs[0]})`;
 const c=document.querySelector('#chip span');c.textContent=P.chip;c.style.background=P.col;
 const T=document.getElementById('t');T.innerHTML=`<div class="ln">${P.l1}</div><div class="ln" style="color:${P.col}">${P.l2}</div>`;T.querySelectorAll('.ln').forEach(l=>{l.style.whiteSpace='nowrap';l.style.display='inline-block';let fs=128;l.style.fontSize=fs+'px';while(l.offsetWidth>980&&fs>60){fs-=4;l.style.fontSize=fs+'px'}l.style.display='block'});
 const card=document.getElementById('card');
 card.innerHTML=P.imgs.map((u,k)=>`<div style="background-image:url(${u});background-position:${P.imgs.length>1?'50% 50%':'-90px -'+P.top+'px'};${P.imgs.length>1?'background-size:cover':''}"></div>`).join('');
 if(P.imgs.length>1)card.innerHTML+=`<span class="lab" style="left:18px;background:#e04848">VORHER</span><span class="lab" style="right:18px;background:#d9a21b;color:#111">NACHHER</span>`;}
</script></body></html>
