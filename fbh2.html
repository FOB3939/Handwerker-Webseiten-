<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
:root{--w:#ff8a3d;--c:#5aa9ff;--tq:#2ee6d6;--y:#ffd23f;--ink:#071631}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#061430}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 40%,#173f7d 0%,#0b2350 50%,#061430 100%)}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:60px;right:60px;text-align:center;display:none;z-index:5}
#part{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:5}
#part span{display:inline-block;font:800 28px Montserrat;letter-spacing:.14em;background:var(--tq);color:var(--ink);padding:8px 20px;border-radius:30px}
#head{top:215px;font:700 84px Oswald;line-height:1.02;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.chip{display:inline-block;font:800 40px Montserrat;color:var(--ink);padding:14px 28px;border-radius:40px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
#caps{position:absolute;left:90px;right:150px;top:1450px;text-align:center;z-index:20}
#caps div{display:inline-block;background:rgba(5,14,36,.9);border:3px solid rgba(46,230,214,.55);border-radius:20px;padding:12px 28px;font:800 54px Montserrat;line-height:1.16;max-width:840px}
#caps span.on{color:var(--y)}
#end{position:absolute;inset:0;display:none;z-index:30;background:radial-gradient(ellipse at 50% 40%,#173f7d 0%,#061430 80%)}
#end .t{display:block}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage">
<svg id="sv" viewBox="0 0 1080 1920"></svg>
<div id="part"><span>FUSSBODENHEIZUNG · TEIL 2</span></div>
<div class="t" id="head"></div>
<div class="t" id="k1" style="top:1260px"><span class="chip" style="background:#c9a26b">🟤 Schlamm & Ablagerungen</span></div>
<div class="t" id="k2" style="top:1260px"><span class="chip" style="background:var(--tq)">💧 Kreis für Kreis spülen</span></div>
<div class="t" id="k3" style="top:1260px"><span class="chip" style="background:#bfe9ff">🧪 Befüllen mit VE-Wasser</span></div>
<div class="t" id="k4" style="top:1260px"><span class="chip" style="background:#2bd67b">✓ Wieder gleichmäßig warm</span></div>
<div class="t" id="k5" style="top:1360px"><span class="chip" style="background:var(--y)">🔧 Gehört in Fachhände</span></div>
<div id="end"><div class="t" style="top:660px;font-size:110px">🔥💧</div><div class="t" id="e1" style="top:840px;font:800 66px Montserrat;line-height:1.12">Haustechnik<br><span style="color:#2ee6d6">einfach erklärt</span></div><div class="t" id="e2" style="top:1060px;font:800 42px Montserrat;color:#b8c8ea">Teil 1 verpasst? Schau im Profil!</div><div class="t" id="e3" style="top:1170px;font:700 104px Oswald;color:#ffd23f">fob-fm.de</div></div>
<div id="caps"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const C=CUES,T=C.total,INK='#071631',WARM='#ff8a3d',COLD='#5aa9ff';
const A=(id,k,v)=>$(id).setAttribute(k,v);
const mix=(a,b,k)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const x=h(a),y=h(b);return `rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*k)).join(',')})`};
// room top view with serpentine loop: 6 segments colored individually
let segs='';for(let i=0;i<8;i++){const x=180+i*95;segs+=`<path id="sg${i}" d="M${x} ${i%2?1160:470} L${x} ${i%2?470:1160}" stroke="${WARM}" stroke-width="22" stroke-linecap="round"/>`;if(i<7)segs+=`<path id="sb${i}" d="M${x} ${i%2?470:1160} L${x+95} ${i%2?470:1160}" stroke="${WARM}" stroke-width="22" stroke-linecap="round"/>`}
let sludge='';for(let k=0;k<26;k++)sludge+=`<circle id="sl${k}" r="${10+(k%4)*5}" fill="#7a5a3a"/>`;
let man='';for(let k=0;k<4;k++){const x=290+k*170;man+=`<path id="mc${k}" d="M${x} 760 V 1130" stroke="#7a5a3a" stroke-width="30" stroke-linecap="round"/><text x="${x}" y="1180" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="30" fill="#fff">Kreis ${k+1}</text><text id="mk${k}" x="${x}" y="720" text-anchor="middle" font-size="54" opacity="0">✅</text>`}
$('sv').innerHTML=`
<g id="room"><rect x="120" y="420" width="840" height="800" rx="30" fill="#13325e" stroke="#fff" stroke-width="8"/>${segs}<rect x="120" y="420" width="840" height="800" rx="30" fill="none" stroke="#fff" stroke-width="8"/></g>
<g id="pipe" opacity="0"><rect x="100" y="620" width="880" height="400" rx="200" fill="#8a96a8" stroke="${INK}" stroke-width="10"/><rect x="140" y="660" width="800" height="320" rx="160" fill="#3fa9ff"/>
 <path id="dep" d="" fill="#6b4a2c" opacity=".9"/><g id="sld">${sludge}</g>
 <text x="540" y="580" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="34" fill="#b8c8ea">Rohr im Querschnitt</text></g>
<g id="man" opacity="0"><rect x="180" y="640" width="720" height="60" rx="26" fill="#e04848" stroke="${INK}" stroke-width="6"/>${man}
 <g id="hoseS"><path d="M120 670 H180" stroke="#2ee6d6" stroke-width="26"/><text x="60" y="640" font-family="Montserrat" font-weight="800" font-size="30" fill="#2ee6d6">Spülen</text></g>
 <rect x="830" y="1210" width="140" height="120" rx="14" fill="#9aa7b1" stroke="${INK}" stroke-width="6"/><rect id="bucket" x="836" y="1326" width="128" height="0" fill="#7a5a3a"/></g>
<g id="cart" opacity="0"><path d="M80 820 H260" stroke="#9fb4d8" stroke-width="26"/><text x="80" y="790" font-family="Montserrat" font-weight="800" font-size="30" fill="#9fb4d8">Wasser</text>
 <rect x="260" y="640" width="200" height="380" rx="40" fill="#e9eef3" stroke="${INK}" stroke-width="8"/><rect x="280" y="700" width="160" height="260" rx="24" fill="#c9e6ff"/><text x="360" y="850" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="56" fill="${INK}">VE</text>
 <text x="360" y="1070" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="34" fill="#fff">Patrone</text>
 <path id="vef" d="M460 820 H 980" stroke="#bfe9ff" stroke-width="26" stroke-dasharray="40 24"/><text x="740" y="790" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="30" fill="#bfe9ff">aufbereitetes Füllwasser →</text></g>`;
const CH=[];{let cur=[];CAPS.forEach((w,k)=>{cur.push(w);const txt=cur.map(x=>x.text).join(' ');const brk=/[.,?!:;–]$/.test(w.text)||cur.length>=5||txt.length>28;if(brk||k===CAPS.length-1){CH.push(cur);cur=[]}});}
CH.forEach((c,k)=>{c.s=c[0].start-.05;c.e=k+1<CH.length?Math.min(CH[k+1][0].start-.05,c[c.length-1].end+.6):c[c.length-1].end+.5});
const show=(id,on)=>{$(id).style.display=on?'block':'none';return on};
window.render=async function(t){
  const S2=C.mit,S3=C.dann,S4=C.aufb,S5=C.so,E=C.endc;
  const h=$('head');let ht,hc;
  if(t<S2){ht='Nicht mehr<br><span style="color:#5aa9ff">richtig warm?</span>';hc=0}
  else if(t<S3){ht='Ablagerungen<br><span style="color:#c9a26b">im Rohr</span>';hc=S2}
  else if(t<S4){ht='Heizkreise<br><span style="color:#2ee6d6">einzeln spülen</span>';hc=S3}
  else if(t<S5){ht='Befüllen mit<br><span style="color:#bfe9ff">VE-Wasser</span>';hc=S4}
  else{ht='Wieder<br><span style="color:#ff8a3d">gleichmäßig warm</span>';hc=S5}
  show('head',t<E);h.innerHTML=ht;h.style.transform=`scale(${back(p(t,hc+.05,.4))})`;
  // room: uneven warmth at start, even at the end
  const rm=(t<S2+.4)||(t>=S5-.3&&t<E);A('room','opacity',rm?(t<S2?cl(p(t,0,.3))*(1-p(t,S2,.4)):cl(p(t,S5-.3,.4))):0);
  const ev=eo(p(t,S5,1.2));
  for(let i=0;i<8;i++){const uneven=i<3?1:i<5?.45:.1;const k=t<S5?uneven:lerp(uneven,1,ev);const col=mix(COLD,WARM,k);A('sg'+i,'stroke',col);if(i<7)A('sb'+i,'stroke',col)}
  // pipe cross-section with sludge
  const pp=t>=S2&&t<S3+.3;A('pipe','opacity',pp?cl(p(t,S2,.4))*(1-p(t,S3,.3)):0);
  if(pp){const g=eo(p(t,C.schlamm,1.2));A('dep','d',`M140 980 Q 540 ${980-90*g} 940 980 Z M140 660 Q 540 ${660+50*g} 940 660 Z`);
    for(let k=0;k<26;k++){const ph=((t*.12+k/26)%1);A('sl'+k,'cx',140+ph*800);A('sl'+k,'cy',740+((k*53)%180));A('sl'+k,'opacity',g*.9)}}
  // manifold: circuits flushed one by one (brown -> clear)
  const mn=t>=S3&&t<S4+.3;A('man','opacity',mn?cl(p(t,S3,.4))*(1-p(t,S4,.3)):0);
  const dur=(S4-.3-(S3+.6))/4;
  for(let k=0;k<4;k++){const st=S3+.6+k*dur;const q=p(t,st,dur*.9);A('mc'+k,'stroke',mix('#7a5a3a','#5ab0ff',eo(q)));A('mk'+k,'opacity',q>=1?1:0)}
  A('bucket','y',1326-80*p(t,S3+.6,S4-S3-.9));A('bucket','height',80*p(t,S3+.6,S4-S3-.9));
  // cartridge
  const ct=t>=S4&&t<S5+.3;A('cart','opacity',ct?cl(p(t,S4,.4))*(1-p(t,S5,.3)):0);A('vef','stroke-dashoffset',-t*120);
  // chips
  if(show('k1',t>=C.schlamm&&t<S3))$('k1').style.transform=`scale(${back(p(t,C.schlamm,.4))})`;
  if(show('k2',t>=C.gesp&&t<S4))$('k2').style.transform=`scale(${back(p(t,C.gesp,.4))})`;
  if(show('k3',t>=C.vollent&&t<S5))$('k3').style.transform=`scale(${back(p(t,C.vollent,.4))})`;
  if(show('k4',t>=C.gleich&&t<E))$('k4').style.transform=`scale(${back(p(t,C.gleich,.4))})`;
  if(show('k5',t>=C.fach&&t<E))$('k5').style.transform=`scale(${back(p(t,C.fach,.4))})`;
  const inE=t>=E;$('end').style.display=inE?'block':'none';
  if(inE)[['e1',.2],['e2',.6],['e3',.9]].forEach(([id,d])=>{const k=eo(p(t,E+d,.5));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*30}px)`});
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){html=c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${w.text}</span>`).join(' ');break}}
  $('caps').innerHTML=t<E&&html?`<div>${html}</div>`:'';
};
window.addEventListener('load',()=>document.fonts.ready.then(()=>render(0)));
</script>
</body>
</html>
