<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
:root{--w:#ff8a3d;--c:#5aa9ff;--tq:#2ee6d6;--y:#ffd23f;--ink:#071631}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#061430}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 40%,#173f7d 0%,#0b2350 50%,#061430 100%)}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:60px;right:60px;text-align:center;display:none;z-index:6}
#head{top:200px;font:700 82px Oswald;line-height:1.02;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.card{display:inline-flex;align-items:center;gap:20px;text-align:left;background:rgba(16,40,84,.96);border:5px solid var(--tq);border-radius:28px;padding:18px 28px;font:800 42px Montserrat;line-height:1.15;max-width:940px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card i{flex:none;font-style:normal;font-size:60px}
.chip{display:inline-block;font:800 38px Montserrat;color:var(--ink);padding:12px 26px;border-radius:40px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
#caps{position:absolute;left:90px;right:150px;top:1450px;text-align:center;z-index:20}
#caps div{display:inline-block;background:rgba(5,14,36,.92);border:3px solid rgba(46,230,214,.55);border-radius:20px;padding:12px 28px;font:800 52px Montserrat;line-height:1.16;max-width:840px}
#caps span.on{color:var(--y)}
#end{position:absolute;inset:0;display:none;z-index:30;background:radial-gradient(ellipse at 50% 40%,#173f7d 0%,#061430 80%)}
#end .t{display:block}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage">
<svg id="sv" viewBox="0 0 1080 1920"></svg>
<div class="t" id="head"></div>
<div class="t" id="c1" style="top:1230px"><span class="chip" style="background:#bfe9ff">☀️ → ❄️ Nach dem Sommer oft festgesessen</span></div>
<div class="t" id="c2" style="top:1230px"><span class="chip" style="background:#c9d3de">🔩 Überwurfmutter oder Clip</span></div>
<div class="t" id="c3" style="top:1230px"><span class="chip" style="background:#2bd67b">✓ federt zurück = in Ordnung</span></div>
<div class="t" id="c4" style="top:1190px"><div class="card" style="border-color:#ff6b6b"><i>📞</i><div>Sitzt fest? Ventil hängt<br>→ Fachbetrieb, keine Gewalt</div></div></div>
<div id="end"><div class="t" style="top:660px;font-size:110px">🌡️🔧</div><div class="t" id="e1" style="top:840px;font:800 66px Montserrat;line-height:1.12">Haustechnik<br><span style="color:#2ee6d6">einfach erklärt</span></div><div class="t" id="e2" style="top:1060px;font:800 42px Montserrat;color:#b8c8ea">🔖 Speichern für die Heizsaison</div><div class="t" id="e3" style="top:1170px;font:700 104px Oswald;color:#ffd23f">fob-fm.de</div></div>
<div id="caps"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const C=CUES,T=C.total,INK='#071631',WARM='#ff8a3d',COLD='#5aa9ff';
const A=(id,k,v)=>$(id).setAttribute(k,v);
let ribs='';for(let i=0;i<9;i++)ribs+=`<rect x="${150+i*70}" y="520" width="56" height="400" rx="20" fill="#f2f5f8" stroke="${INK}" stroke-width="6"/>`;
let sn='';for(let k=0;k<10;k++)sn+=`<text id="sn${k}" font-size="44">❄️</text>`;
$('sv').innerHTML=`
<g id="rad"><rect x="140" y="540" width="640" height="360" rx="24" fill="#dfe6ee"/>${ribs}<rect id="cold" x="140" y="520" width="640" height="400" rx="24" fill="${COLD}" opacity=".25"/>
 <path d="M780 860 H 860 V 1000" stroke="#c9d3de" stroke-width="26" fill="none"/>
 <g transform="translate(860,820)"><rect x="-34" y="0" width="68" height="70" rx="12" fill="#c9a24a" stroke="${INK}" stroke-width="6"/></g>
 <g id="head1" transform="translate(860,820)"><rect x="-46" y="-160" width="92" height="160" rx="36" fill="#f2f5f8" stroke="${INK}" stroke-width="7"/><path d="M-30 -120 h60 M-30 -90 h60 M-30 -60 h60" stroke="#c9d3de" stroke-width="6"/><text y="-130" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="36" fill="${INK}">5</text></g>
 <g id="sns">${sn}</g></g>
<g id="pin" opacity="0" transform="translate(540,860)">
 <rect x="-330" y="-300" width="660" height="560" rx="40" fill="#0d2752" stroke="#2a5596" stroke-width="6"/>
 <rect x="-150" y="20" width="300" height="190" rx="26" fill="#c9a24a" stroke="${INK}" stroke-width="8"/><rect x="-80" y="-30" width="160" height="60" rx="12" fill="#d9b45c" stroke="${INK}" stroke-width="7"/><path d="M-80 -16 h160 M-80 0 h160 M-80 16 h160" stroke="#9a7a30" stroke-width="4"/>
 <rect id="stift" x="-13" y="-110" width="26" height="86" rx="9" fill="#d6dde6" stroke="${INK}" stroke-width="6"/>
 <g id="finger"><rect x="-44" y="-340" width="88" height="200" rx="44" fill="#ffd2b0" stroke="${INK}" stroke-width="6"/><rect x="-30" y="-172" width="60" height="26" rx="10" fill="#fff0e6"/></g>
 <text x="0" y="245" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="34" fill="#b8c8ea">Ventilstift</text>
 <g id="okp" opacity="0"><circle cx="230" cy="-190" r="52" fill="#2bd67b" stroke="${INK}" stroke-width="6"/><text x="230" y="-170" text-anchor="middle" font-size="56" fill="#fff">✓</text></g>
 <g id="badp" opacity="0"><circle cx="230" cy="-190" r="52" fill="#ff4d5a" stroke="${INK}" stroke-width="6"/><text x="230" y="-170" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="60" fill="#fff">✕</text></g></g>`;
const CH=[];{let cur=[];CAPS.forEach((w,k)=>{cur.push(w);const txt=cur.map(x=>x.text).join(' ');const brk=/[.,?!:;–]$/.test(w.text)||cur.length>=5||txt.length>28;if(brk||k===CAPS.length-1){CH.push(cur);cur=[]}});}
CH.forEach((c,k)=>{c.s=c[0].start-.05;c.e=k+1<CH.length?Math.min(CH[k+1][0].start-.05,c[c.length-1].end+.6):c[c.length-1].end+.5});
const show=(id,on)=>{$(id).style.display=on?'block':'none';return on};
window.render=async function(t){
  const E=C.endc;
  const h=$('head');let ht,hc;
  if(t<C.oft){ht='Heizkörper<br><span style="color:#5aa9ff">bleibt kalt?</span>';hc=0}
  else if(t<C.kopf){ht='Oft hängt der<br><span style="color:#ffd23f">Ventilstift</span>';hc=C.oft}
  else if(t<C.dann){ht='① Thermostatkopf<br><span style="color:#2ee6d6">abnehmen</span>';hc=C.kopf}
  else if(t<C.sitzt){ht='② Stift<br><span style="color:#2ee6d6">eindrücken</span>';hc=C.dann}
  else{ht='Sitzt fest?<br><span style="color:#ff6b6b">Ventil hängt</span>';hc=C.sitzt}
  show('head',t<E);h.innerHTML=ht;h.style.transform=`scale(${back(p(t,hc+.05,.4))})`;
  // radiator scene
  const rd=t<C.dann+.3;A('rad','opacity',rd?cl(p(t,0,.3))*(1-p(t,C.dann,.3)):0);
  A('cold','opacity',.22+.08*Math.sin(t*3));
  for(let k=0;k<10;k++){const y=480+((t*60+k*47)%440),x=170+((k*137)%600);A('sn'+k,'x',x);A('sn'+k,'y',y);A('sn'+k,'opacity',t<C.oft+1.5?.7:.0)}
  // thermostat head: turned to 5, then unscrewed and lifted
  const un=p(t,C.kopf+.2,1.2);A('head1','transform',`translate(860,${820-eo(p(t,C.kopf+.9,.6))*260}) rotate(${-un*540*0.0+Math.sin(un*Math.PI*4)*8*(un<1?1:0)})`);
  // pin close-up
  const pn=t>=C.dann&&t<E;A('pin','opacity',pn?cl(p(t,C.dann,.3)):0);
  if(pn){const k=back(p(t,C.dann,.4));let press=0;const stuck=t>=C.sitzt;
    if(!stuck){press=t>=C.stift?Math.max(0,Math.sin((t-C.stift)*1.4*Math.PI)):0}else{press=.1*Math.max(0,Math.sin((t-C.sitzt)*7))}
    A('pin','transform',`translate(540,860) scale(${k})`);A('finger','transform',`translate(0,${press*60})`);A('stift','y',stuck?-110+press*8:-110+press*60);
    A('okp','opacity',!stuck&&t>=C.beweg?1:0);A('badp','opacity',stuck?1:0)}
  if(show('c1',t>=C.oft+.3&&t<C.kopf))$('c1').style.transform=`scale(${back(p(t,C.oft+.3,.4))})`;
  if(show('c2',t>=C.ueber&&t<C.dann))$('c2').style.transform=`scale(${back(p(t,C.ueber,.4))})`;
  if(show('c3',t>=C.selbst&&t<C.sitzt))$('c3').style.transform=`scale(${back(p(t,C.selbst,.4))})`;
  if(show('c4',t>=C.sitzt+.3&&t<E))$('c4').style.transform=`scale(${back(p(t,C.sitzt+.3,.4))})`;
  const inE=t>=E;$('end').style.display=inE?'block':'none';
  if(inE)[['e1',.2],['e2',.6],['e3',.9]].forEach(([id,d])=>{const k=eo(p(t,E+d,.5));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*30}px)`});
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){html=c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${w.text}</span>`).join(' ');break}}
  $('caps').innerHTML=t<E&&html?`<div>${html}</div>`:'';
};
window.addEventListener('load',()=>document.fonts.ready.then(()=>render(0)));
</script>
</body>
</html>
