<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:500;src:url(assets/fonts/oswald-latin-500-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
:root{--gold:#D49B0B;--gold2:#F0B92A;--ink:#121110;--red:#E0442A;--green:#3FA34D}
/* ---------- themes ---------- */
.t-dark{--bg:radial-gradient(circle at 50% 40%,#2b261f 0%,#0e0d0c 70%);--fg:#fff;--sub:#d8d0c2;--acc:#F0B92A;--card:rgba(255,255,255,.07);--cardb:rgba(255,255,255,.14);--line:rgba(240,185,42,.11);--numbg:#F0B92A;--numfg:#121110;--vign:rgba(0,0,0,.5)}
.t-light{--bg:linear-gradient(165deg,#FFFDF8 0%,#EFE7D6 100%);--fg:#121110;--sub:#5a544a;--acc:#C68B00;--card:#fff;--cardb:rgba(18,17,16,.10);--line:rgba(212,155,11,.16);--numbg:#121110;--numfg:#F0B92A;--vign:rgba(120,90,30,.12)}
.t-blue{--bg:radial-gradient(circle at 50% 35%,#17426f 0%,#071628 75%);--fg:#fff;--sub:#bcd3ea;--acc:#F0B92A;--card:rgba(255,255,255,.08);--cardb:rgba(255,255,255,.17);--line:rgba(120,190,255,.13);--numbg:#F0B92A;--numfg:#121110;--vign:rgba(0,0,10,.5)}
.t-gold{--bg:linear-gradient(165deg,#F8C94A 0%,#D49B0B 100%);--fg:#121110;--sub:#3b2f12;--acc:#fff;--card:#fff;--cardb:rgba(18,17,16,.14);--line:rgba(255,255,255,.22);--numbg:#121110;--numfg:#F0B92A;--vign:rgba(90,60,0,.25)}
.t-ice{--bg:linear-gradient(170deg,#F4FAFF 0%,#D7EAF8 100%);--fg:#0f2236;--sub:#3e5670;--acc:#1D6FB8;--card:#fff;--cardb:rgba(15,34,54,.10);--line:rgba(29,111,184,.14);--numbg:#1D6FB8;--numfg:#fff;--vign:rgba(30,80,140,.15);--snow:#9cc3e6}
.t-dark,.t-blue{--snow:rgba(255,255,255,.85)}.t-light{--snow:#c9b98f}.t-gold{--snow:#fff}
.t-gold .osw b{-webkit-text-stroke:3px #121110;paint-order:stroke fill}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:var(--fg);background:var(--bg)}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
/* ---------- backgrounds ---------- */
.bg{position:absolute;display:none}
#bg-speed{left:50%;top:42%;width:3400px;height:3400px;margin:-1700px 0 0 -1700px;
  background:repeating-conic-gradient(from 0deg,var(--line) 0deg 2deg,transparent 2deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 0 220px,#000 700px);mask:radial-gradient(circle,transparent 0 220px,#000 700px)}
#bg-grid{left:-200px;right:-200px;top:-400px;height:2800px;
  background-image:linear-gradient(var(--line) 3px,transparent 3px),linear-gradient(90deg,var(--line) 3px,transparent 3px);background-size:120px 120px}
#bg-dots{inset:0}
#bg-dots i{position:absolute;border-radius:50%;background:var(--line)}
#bg-blobs{inset:0;filter:blur(90px)}
#bg-blobs i{position:absolute;width:620px;height:620px;border-radius:50%;opacity:.55}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.osw{font-family:Oswald;font-weight:700;text-transform:uppercase}
.osw b{color:var(--acc)}
.center{left:60px;right:60px;text-align:center}
#brand{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;align-items:center;gap:18px;z-index:5}
#brand img{width:84px;height:84px;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#brand div{font-family:Oswald;font-weight:700;font-size:40px;letter-spacing:.04em;text-transform:uppercase}
#brand b{color:var(--acc)}
.t-gold #brand b{color:#fff;-webkit-text-stroke:2px #121110;paint-order:stroke fill}
.chip{display:inline-block;font-family:Oswald;font-weight:700;font-size:46px;text-transform:uppercase;padding:6px 30px;border-radius:50px;color:#fff}
.chip.red{background:var(--red)}.chip.gold{background:var(--gold2);color:var(--ink)}.chip.green{background:var(--green)}.chip.ink{background:var(--ink);color:var(--gold2)}
.card{background:var(--card);border:3px solid var(--cardb);box-shadow:0 18px 40px rgba(0,0,0,.18)}
/* hook */
.hvis{left:220px;top:420px;width:640px;height:640px;border-radius:30px;overflow:hidden;border:8px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.45);background-size:cover;background-position:center}
.hicon{left:265px;top:430px;width:550px;height:550px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--red),0 30px 80px rgba(0,0,0,.4)}
.hicon svg{width:340px;height:340px}
.htitle{top:1095px;font-size:112px;line-height:1.02}
.hsub{top:1335px;font:800 44px Montserrat;color:var(--acc)}
.t-gold .hsub{color:var(--ink)}
/* list */
.ltitle{top:330px;font-size:104px;line-height:1}
.lsub{top:460px;font:600 42px Montserrat;color:var(--sub)}
.item{position:absolute;left:70px;right:70px;height:170px;border-radius:28px;display:flex;align-items:center;gap:34px;padding:0 34px}
.item .ic{flex:none;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Oswald;font-weight:700;font-size:62px}
.item .ic svg{width:66px;height:66px}
.item.num .ic{background:var(--numbg);color:var(--numfg)}
.item.red .ic{background:var(--red);color:#fff}
.item.check .ic{background:var(--green);color:#fff}
.item span{font:800 50px Montserrat;line-height:1.1}
/* before / after */
.ba{left:150px;top:300px;width:780px;height:1000px;border-radius:30px;overflow:hidden;border:8px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ba .B,.ba .A{position:absolute;inset:0;background-size:cover;background-position:center}
.ba .bar{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;background:#fff;box-shadow:0 0 30px #fff}
.ba .chip{position:absolute;top:26px;font-size:38px}
.ba .chipV{left:26px}.ba .chipN{right:26px}
.ba .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 30px 30px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-family:Oswald;font-weight:700;font-size:62px;text-transform:uppercase;line-height:1.05}
/* tip */
.tipbox{left:70px;right:70px;top:420px;border-radius:34px;background:var(--gold2);color:var(--ink);padding:150px 60px 70px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.t-gold .tipbox{background:#fff}
.tipbox .tt{font:800 64px Montserrat;line-height:1.15}
.tiphead{left:0;right:0;top:330px;display:flex;justify-content:center}
.tiphead div{width:220px;height:220px;border-radius:50%;background:#fff;border:10px solid var(--gold2);display:flex;align-items:center;justify-content:center}
.tiphead svg{width:120px;height:120px}
/* stat */
.snum{top:430px;font-family:Oswald;font-weight:700;font-size:330px;line-height:1;color:var(--acc)}
.t-gold .snum{color:#fff;-webkit-text-stroke:6px #121110;paint-order:stroke fill}
.snum small{font-size:120px}
.stitle{top:850px;font-size:86px;line-height:1.05}
.ssub{top:1110px;font:600 44px Montserrat;color:var(--sub);white-space:normal}
/* myth */
.mcard{left:70px;right:70px;border-radius:34px;padding:110px 50px 50px;text-align:center}
.mcard .lab{position:absolute;left:50%;top:-38px;transform:translateX(-50%);white-space:nowrap}
.mcard .tx{font:800 58px Montserrat;line-height:1.15}
.mcard .strike{position:absolute;left:40px;right:40px;top:55%;height:12px;background:var(--red);border-radius:6px;transform-origin:left center}
.mcard .seal{position:absolute;right:30px;top:30px;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 64px Montserrat;color:#fff}
/* quiz */
.qq{top:320px;font-size:84px;line-height:1.05}
.opt{position:absolute;left:90px;right:90px;height:150px;border-radius:28px;display:flex;align-items:center;gap:30px;padding:0 30px;font:800 52px Montserrat}
.opt .l{flex:none;width:96px;height:96px;border-radius:50%;background:var(--numbg);color:var(--numfg);display:flex;align-items:center;justify-content:center;font:700 54px Oswald}
.opt.ok{background:var(--green)!important;border-color:var(--green)!important;color:#fff}
.opt.ok .l{background:#fff;color:var(--green)}
.qtimer{left:440px;top:1240px;width:200px;height:200px}
/* compare */
.cmp{top:430px;width:440px;height:780px;border-radius:34px;display:flex;flex-direction:column;align-items:center;padding:40px 28px;gap:30px;text-align:center}
.cmp svg{width:200px;height:200px}
.cmp .tx{font:800 46px Montserrat;line-height:1.15}
.cmp .chip{font-size:44px}
.vs{left:470px;top:740px;width:140px;height:140px;border-radius:50%;background:var(--ink);color:var(--gold2);border:8px solid var(--gold2);display:flex;align-items:center;justify-content:center;font:700 60px Oswald;z-index:3}
.ctitle{top:320px;font-size:84px;line-height:1}
/* cta */
.clogo{left:290px;top:300px;width:500px;height:500px;border-radius:50%;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.c1{top:860px;font-size:78px;line-height:1.05}
.c2{top:1090px;font:800 132px Montserrat;color:var(--acc)}
.t-gold .c2{color:#fff;-webkit-text-stroke:4px #121110;paint-order:stroke fill}
.c3{top:1270px;display:flex;justify-content:center;gap:20px}
.c3 div{font-family:Oswald;font-weight:700;font-size:48px;text-transform:uppercase;padding:4px 24px;background:var(--ink);color:#fff}
.c3 div:nth-child(2){background:var(--gold2);color:var(--ink)}
.t-gold .c3 div:nth-child(2){background:#fff}
/* captions */
#caps{position:absolute;left:50px;right:50px;top:1450px;text-align:center;z-index:15}
#caps div{display:inline-block;background:rgba(18,17,16,.84);color:#fff;border-radius:22px;padding:12px 30px;font:800 56px Montserrat;line-height:1.18;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#caps span.on{color:var(--gold2)}
/* fx */
#swipe{position:absolute;inset:-300px;z-index:20;pointer-events:none}
#swipe div{position:absolute;left:0;right:0;height:700px;transform:skewY(-14deg)}
#iris{position:absolute;inset:0;z-index:20;background:var(--gold2);display:none}
#slices{position:absolute;inset:0;z-index:20;pointer-events:none}
#slices div{position:absolute;left:0;width:100%;height:322px;display:none}
#gbars{position:absolute;inset:0;z-index:21;pointer-events:none;display:none}
#gbars i{position:absolute;left:0;right:0;mix-blend-mode:screen}
#bg-snow{inset:0}
#bg-snow i{position:absolute;border-radius:50%;background:var(--snow);box-shadow:0 0 6px var(--snow)}
/* cta variants */
.cbtn{left:140px;right:140px;height:150px;border-radius:80px;display:flex;align-items:center;justify-content:center;gap:24px;font-family:Oswald;font-weight:700;font-size:70px;text-transform:uppercase;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.cbtn .sh{position:absolute;top:0;bottom:0;width:140px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.hand{width:150px;height:150px;z-index:4}
.bub{max-width:760px;border-radius:40px;padding:30px 40px;font:800 50px Montserrat;line-height:1.15;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.bub.me{right:80px;background:#fff;color:#121110;border-bottom-right-radius:8px}
.bub.fob{left:80px;background:var(--gold2);color:#121110;border-bottom-left-radius:8px;display:flex;align-items:center;gap:24px}
.bub.fob img{width:80px;height:80px;border-radius:50%}
.dots{left:80px;background:var(--card);border:3px solid var(--cardb);border-radius:40px;padding:26px 36px;display:flex;gap:14px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--sub)}
.small{font:600 40px Montserrat;color:var(--sub)}
.bigtxt{font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:170px;line-height:1;color:var(--acc)}
.t-gold .bigtxt{color:#fff;-webkit-text-stroke:5px #121110;paint-order:stroke fill}
.cal{left:340px;top:330px;width:400px;height:400px}
#flash{position:absolute;inset:0;background:#fff;z-index:30;opacity:0}
#vign{position:absolute;inset:0;z-index:12;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,var(--vign) 100%)}
#prog{position:absolute;left:0;top:0;height:10px;background:var(--gold2);z-index:40}
.t-gold #prog{background:#121110}
#black{position:absolute;inset:0;background:#000;z-index:50;opacity:0}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage"><div id="cam">
  <div class="bg" id="bg-speed"></div><div class="bg" id="bg-grid"></div><div class="bg" id="bg-dots"></div><div class="bg" id="bg-blobs"></div><div class="bg" id="bg-snow"></div>
  <div id="scenes"></div></div>
<div id="brand"><img src="assets/logo.png"><div>FOB <b>Haustechnik</b></div></div>
<div id="vign"></div><div id="caps"></div>
<div id="swipe"><div style="background:#F0B92A"></div><div style="background:#121110"></div><div style="background:#fff"></div></div>
<div id="iris"></div><div id="slices"></div><div id="gbars"></div>
<div id="flash"></div><div id="prog"></div><div id="black"></div></div>
<script>
// ---------- icon set (viewBox 0 0 100 100) ----------
const S='fill="none" stroke="#121110" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"';
const G='#D49B0B';
const ICONS={
 toilet:`<svg viewBox="0 0 100 100" ${S}><rect x="22" y="10" width="40" height="26" rx="4" fill="${G}"/><path d="M16 46h64c0 18-12 28-28 28h-6l2 16H32l2-18C22 68 16 58 16 46z"/><path d="M42 36v10"/></svg>`,
 drop:`<svg viewBox="0 0 100 100" ${S}><path d="M50 10C38 30 24 44 24 62a26 26 0 0 0 52 0C76 44 62 30 50 10z" fill="#4FA3E0"/><path d="M38 64a12 12 0 0 0 12 12"/></svg>`,
 faucet:`<svg viewBox="0 0 100 100" ${S}><path d="M14 38h44a12 12 0 0 1 12 12v8"/><path d="M38 38V24h-12M38 24h12"/><path d="M70 68c-5 8-7 11-7 15a7 7 0 0 0 14 0c0-4-2-7-7-15z" fill="#4FA3E0"/></svg>`,
 wrench:`<svg viewBox="0 0 100 100" ${S}><path d="M66 10a22 22 0 0 0-24 28L12 68a10 10 0 0 0 14 14l30-30a22 22 0 0 0 28-24L72 40 60 28z" fill="${G}"/></svg>`,
 bolt:`<svg viewBox="0 0 100 100" ${S}><path d="M58 8L24 56h22l-6 36 36-50H54z" fill="${G}"/></svg>`,
 socket:`<svg viewBox="0 0 100 100" ${S}><rect x="14" y="14" width="72" height="72" rx="14"/><circle cx="50" cy="50" r="24" fill="${G}"/><circle cx="41" cy="50" r="4" fill="#121110"/><circle cx="59" cy="50" r="4" fill="#121110"/></svg>`,
 paint:`<svg viewBox="0 0 100 100" ${S}><rect x="14" y="14" width="56" height="22" rx="5" fill="${G}"/><path d="M70 25h10v22H44v12"/><rect x="38" y="59" width="12" height="30" rx="3"/></svg>`,
 house:`<svg viewBox="0 0 100 100" ${S}><path d="M14 46L50 16l36 30v42H14z" fill="${G}"/><rect x="26" y="54" width="14" height="14" fill="#fff"/><rect x="60" y="54" width="14" height="14" fill="#fff"/><path d="M42 88V72h16v16"/></svg>`,
 leaf:`<svg viewBox="0 0 100 100" ${S}><path d="M18 84C18 42 44 18 84 16c0 40-22 66-66 68z" fill="#5BAA5E"/><path d="M18 84l40-40"/></svg>`,
 snow:`<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="50" r="12" fill="#7fc4ef"/><path d="M50 8v84M14 29l72 42M14 71l72-42M42 14l8 8 8-8M42 86l8-8 8 8"/></svg>`,
 heatpump:`<svg viewBox="0 0 100 100" ${S}><rect x="8" y="22" width="84" height="60" rx="8" fill="#F2EEE6"/><circle cx="40" cy="52" r="20" fill="${G}"/><path d="M40 52l10-12M40 52l-14-4M40 52l4 16"/><path d="M72 32v40M80 32v40"/></svg>`,
 radiator:`<svg viewBox="0 0 100 100" ${S}><rect x="12" y="24" width="76" height="54" rx="6" fill="${G}"/><path d="M28 24v54M44 24v54M60 24v54M76 24v54M12 86h10M78 86h10"/></svg>`,
 thermo:`<svg viewBox="0 0 100 100" ${S}><path d="M42 60V18a8 8 0 0 1 16 0v42a16 16 0 1 1-16 0z"/><circle cx="50" cy="74" r="9" fill="#E0442A"/><path d="M50 66V36" stroke="#E0442A"/></svg>`,
 euro:`<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="50" r="38" fill="${G}"/><path d="M64 34a20 20 0 1 0 0 32M28 46h28M28 56h28"/></svg>`,
 clock:`<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="50" r="38" fill="${G}"/><path d="M50 26v26l16 10"/></svg>`,
 warning:`<svg viewBox="0 0 100 100" ${S}><path d="M50 10L92 84H8z" fill="#E0442A"/><path d="M50 38v20" stroke="#fff"/><circle cx="50" cy="70" r="3" fill="#fff" stroke="#fff"/></svg>`,
 check:`<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="50" r="38" fill="#5BAA5E"/><path d="M32 52l12 12 24-26" stroke="#fff"/></svg>`,
 key:`<svg viewBox="0 0 100 100" ${S}><circle cx="32" cy="50" r="16"/><circle cx="32" cy="50" r="5" fill="${G}"/><path d="M48 50h40M78 50v14M88 50v10"/></svg>`,
 shower:`<svg viewBox="0 0 100 100" ${S}><path d="M20 90V30a16 16 0 0 1 32 0"/><path d="M38 34h28l-4 10H42z" fill="${G}"/><path d="M44 54v8M52 54v12M60 54v8M48 70v6M56 70v6" stroke="#4FA3E0"/></svg>`,
 mold:`<svg viewBox="0 0 100 100" ${S}><rect x="12" y="12" width="76" height="76" rx="8" fill="#F2EEE6"/><circle cx="34" cy="36" r="8" fill="#4a4a3a"/><circle cx="62" cy="58" r="11" fill="#4a4a3a"/><circle cx="40" cy="66" r="5" fill="#4a4a3a"/><circle cx="66" cy="28" r="4" fill="#4a4a3a"/></svg>`,
 window:`<svg viewBox="0 0 100 100" ${S}><rect x="16" y="12" width="68" height="76" rx="4" fill="#bfe1f7"/><path d="M50 12v76M16 50h68"/></svg>`,
 bulb:`<svg viewBox="0 0 100 100" ${S}><path d="M36 64c-8-6-14-14-14-26a28 28 0 0 1 56 0c0 12-6 20-14 26v8H36z" fill="${G}"/><path d="M38 82h24M42 92h16"/></svg>`,
 flame:`<svg viewBox="0 0 100 100" ${S}><path d="M50 8c6 18 26 24 26 48a26 26 0 0 1-52 0c0-12 6-18 12-26 2 10 8 12 10 12 0-14 0-22 4-34z" fill="#4FA3E0"/></svg>`,
 broom:`<svg viewBox="0 0 100 100" ${S}><path d="M70 10L46 52"/><path d="M40 48l18 10-8 30c-10 0-26-8-32-18z" fill="${G}"/></svg>`,
 pipe:`<svg viewBox="0 0 100 100" ${S}><path d="M10 36h46a12 12 0 0 1 12 12v42" stroke-width="14" stroke="#9a948a"/><path d="M10 36h46a12 12 0 0 1 12 12v42" stroke="#121110" stroke-width="4"/><path d="M76 70c-4 7-6 9-6 13a6 6 0 0 0 12 0c0-4-2-6-6-13z" fill="#4FA3E0"/></svg>`,
 phone:`<svg viewBox="0 0 100 100" ${S}><path d="M30 12l12 22-10 8c6 12 14 20 26 26l8-10 22 12-6 16C52 88 12 48 14 18z" fill="${G}"/></svg>`,
 calendar:`<svg viewBox="0 0 100 100" ${S}><rect x="14" y="20" width="72" height="66" rx="8" fill="#fff"/><path d="M14 38h72" /><rect x="14" y="20" width="72" height="18" fill="${G}"/><path d="M32 12v16M68 12v16"/></svg>`,
 tools:`<svg viewBox="0 0 100 100" ${S}><path d="M20 80l40-40M62 18a14 14 0 0 0 18 18l-8 8-18-18z" fill="${G}"/><path d="M80 80L36 36M22 22l14 14-6 6-14-14z"/></svg>`,
};
const icon=n=>ICONS[n]||ICONS.wrench;

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=2.0;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,a,d=.45)=>back(p(t,a,d));
function tf(el,{o,x=0,y=0,s=1,r=0}){if(o!==undefined)el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`}

      const done=t>=tap+.05;E.btn.style.background=done?'var(--green)':'#fff';E.btn.style.color=done?'#fff':'#121110';E.btxt.textContent=done?'✓ Gefolgt':'+ Folgen';
      if(done)E.btn.style.transform+=` scale(${1+.08*Math.sin(cl((t-tap)/.35)*Math.PI)})`;
      E.btn.querySelector('.sh').style.left=(((t*.7)%1)*1100-200)+'px';
      enter(E.handle,t,s0+1,1);
    }else if(T==='cta'&&sc.variant==='dm'){
      enter(E.c1,t,s0+.05,-1,true);
      enter(E.b1,t,s0+.45,1);
      const rp=IT[0]??s0+2.2;
      E.typing.style.opacity=t>s0+1.1&&t<rp?1:0;[...E.typing.children].forEach((d,i)=>d.style.transform=`translateY(${-10*Math.max(0,Math.sin(t*9-i))}px)`);
      if(t>=rp)enter(E.b2,t,rp,-1);else E.b2.style.opacity=0;
      enter(E.c3,t,rp+.6,1);
    }else if(T==='cta'&&sc.variant==='book'){
      const kc=pop(t,s0+.05,.55);tf(E.cal,{o:cl(kc*3),s:kc,r:(1-kc)*-20});
      E.cal.querySelector('[data-k=tick]').setAttribute('stroke-dashoffset',80*(1-eo(p(t,s0+.8,.5))));
      enter(E.c1,t,s0+.4,1);
      const kb=pop(t,IT[0]??s0+1.2,.45);tf(E.btn,{o:cl(kb*3),s:kb*(1+.04*Math.sin(t*6))});
      E.btn.querySelector('.sh').style.left=(((t*.8)%1)*1100-200)+'px';
      enter(E.c3,t,(IT[0]??s0+1.2)+.5,-1);
    }else if(T==='cta'&&sc.variant==='bio'){
      const ka=pop(t,s0+.05,.45);tf(E.arrow,{o:cl(ka*3),s:ka,y:-Math.abs(Math.sin(t*5))*40});
      const kb=pop(t,s0+.3,.5);tf(E.big,{o:cl(kb*3),s:2-kb});
      enter(E.c1,t,s0+.8,1);
      const kl=pop(t,s0+1.2,.5);tf(E.logo,{o:cl(kl*3),s:kl,r:(1-kl)*90});
    }else if(T==='cta'){
      const kl=pop(t,s0+.05,.6);tf(E.logo,{o:cl(kl*3),s:.5+.5*kl,r:(1-kl)*30});
      enter(E.c1,t,s0+.35,1);
      const k2=pop(t,(IT[0]??s0+1.2),.5);tf(E.c2,{o:cl(k2*3),s:k2*(1+.03*Math.sin(t*5))});
      [...E.c3.children].forEach((c,j)=>{const kk=pop(t,(IT[0]??s0+1.2)+.5+j*.25,.3);c.style.opacity=cl(kk*3);c.style.transform=`scale(${2.2-1.2*kk}) rotate(${(j-1)*2}deg)`});
    }
  });
  // captions
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){const k=pop(t,c.s,.18);
    html=`<div style="transform:scale(${.7+.3*k});opacity:${cl(k*3)}">`+c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${esc(w.text)}</span>`).join(' ')+'</div>';break}}
  $('caps').innerHTML=html;
};
document.fonts.ready.then(()=>render(0));
</script>
