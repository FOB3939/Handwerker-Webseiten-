<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
:root{--g:#F0B92A;--ice:#9fd3ff;--ink:#0e1620}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:#0b121a}
.shot{position:absolute;inset:0;display:none;overflow:hidden}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(34px) brightness(.38)}
.fit{position:absolute;left:0;width:1080px}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,18,.75) 0%,rgba(5,10,18,.1) 30%,rgba(5,10,18,0) 55%,rgba(5,10,18,.65) 82%,rgba(5,10,18,.85) 100%)}
canvas{position:absolute;inset:0;z-index:5;pointer-events:none}
#brand{position:absolute;left:0;right:0;top:140px;display:flex;justify-content:center;align-items:center;gap:16px;z-index:9}
#brand img{width:80px;height:80px;border-radius:50%}
#brand div{font:700 38px Oswald;letter-spacing:.05em;text-transform:uppercase}
#brand b{color:var(--g)}
#title{position:absolute;left:60px;right:60px;top:290px;text-align:center;z-index:10}
#title .k{display:inline-block;font:800 34px Montserrat;text-transform:uppercase;letter-spacing:.06em;background:var(--ice);color:var(--ink);padding:6px 22px;border-radius:30px;margin-bottom:22px}
#title .h{font:800 96px Montserrat;line-height:1.02;text-transform:uppercase;text-shadow:0 8px 34px rgba(0,0,0,.7)}
#title .h b{color:var(--g)}
#title .h small{display:block;font-size:56px;line-height:1.15;margin-top:10px}
/* options */
#opt{position:absolute;inset:0;z-index:11;display:none}
.oc{position:absolute;left:70px;right:70px;border-radius:30px;padding:40px 44px;background:rgba(10,18,28,.82);border:3px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.oc .l{display:inline-block;font:800 32px Montserrat;text-transform:uppercase;padding:6px 20px;border-radius:24px;margin-bottom:18px}
.oc .t{font:800 70px Montserrat;text-transform:uppercase;line-height:1}
.oc .s{font:600 40px Montserrat;color:#d7e4f0;margin-top:14px}
#oA{top:560px;border-color:var(--g)}#oA .l{background:var(--g);color:var(--ink)}
#oB{top:930px;border-color:var(--ice)}#oB .l{background:var(--ice);color:var(--ink)}
#or{position:absolute;left:0;right:0;top:868px;text-align:center;font:800 40px Montserrat;color:#fff;text-transform:uppercase;letter-spacing:.2em}
#oH{position:absolute;left:60px;right:60px;top:300px;text-align:center;font:800 80px Montserrat;text-transform:uppercase;line-height:1.05}
#oH b{color:var(--g)}
/* end card */
#end{position:absolute;inset:0;z-index:12;display:none;background:radial-gradient(ellipse at 50% 42%,rgba(20,34,52,.55),rgba(5,9,14,.94) 72%)}
#elogo{position:absolute;left:340px;top:330px;width:400px;height:400px;border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#e1{position:absolute;left:60px;right:60px;top:790px;text-align:center;font:800 76px Montserrat;text-transform:uppercase;line-height:1.05}
#e1 b{color:var(--g)}
#e2{position:absolute;left:0;right:0;top:1010px;text-align:center;font:800 120px Montserrat;color:var(--g)}
#e3{position:absolute;left:60px;right:60px;top:1175px;text-align:center;font:600 40px Montserrat;color:#d7e4f0}
#caps{position:absolute;left:60px;right:60px;top:1480px;text-align:center;z-index:20}
#caps div{display:inline-block;background:rgba(5,10,18,.82);border-radius:18px;padding:12px 30px;font:800 54px Montserrat;line-height:1.18}
#caps span.on{color:var(--g)}
#flash{position:absolute;inset:0;background:#fff;z-index:30;opacity:0}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--g);z-index:31}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage"><div id="shots"></div><canvas id="snow" width="1080" height="1920"></canvas>
<div id="brand"><img src="assets/logo.png"><div>FOB <b>Winterdienst</b></div></div>
<div id="title"><div class="k" id="tk"></div><div class="h" id="th"></div></div>
<div id="opt"><div id="oH">Wie Sie <b>möchten</b></div>
  <div class="oc" id="oA"><span class="l">Variante 1</span><div class="t">Pauschal</div><div class="s">Fester Preis für die ganze Saison</div></div>
  <div id="or">oder</div>
  <div class="oc" id="oB"><span class="l">Variante 2</span><div class="t">Nach Aufwand</div><div class="s">Flexibel abgerechnet pro Einsatz</div></div></div>
<div id="end"><img id="elogo" src="assets/logo.png"><div id="e1">Jetzt <b>Angebot</b><br>anfragen</div><div id="e2">fob-fm.de</div>
  <div id="e3">Weßling · Hochstadt · München &amp; Umgebung</div></div>
<div id="caps"></div><div id="flash"></div><div id="prog"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const D=DATA, T=D.total;
D.shots.forEach(s=>{const d=document.createElement('div');d.className='shot';const u=`jobs/winterdienst/img/${s.img}.jpg`;
  d.innerHTML=s.fit?`<div class="bg" style="background-image:url(${u})"></div><img class="fit" src="${u}" style="top:${s.top||560}px"><div class="shade"></div>`:`<div class="ph" style="background-image:url(${u});background-position:${s.pos||'center'}"></div><div class="shade"></div>`;
  $('shots').appendChild(d);s.el=d;s.m=d.querySelector('.ph,.fit')});
const R=(()=>{let s=5;return()=>((s=(s*16807)%2147483647)/2147483647)})();
const FL=[...Array(140)].map(()=>({x:R()*1080,y:R()*1920,r:2+R()*7,v:80+R()*160,w:R()*6}));
const cv=$('snow'),ctx=cv.getContext('2d');
const CH=[];{let cur=[];D.caps.forEach((w,k)=>{cur.push(w);const brk=/[.,?!:;–]$/.test(w.text)||cur.length>=4||cur.map(x=>x.text).join(' ').length>24;if(brk||k===D.caps.length-1){CH.push(cur);cur=[]}});}
CH.forEach((c,k)=>{c.s=c[0].start;c.e=k+1<CH.length?Math.min(CH[k+1][0].start,c[c.length-1].end+.5):c[c.length-1].end+.8});
window.render=function(t){
  let cur=null;D.shots.forEach(s=>{const on=t>=s.t0&&t<s.t1;s.el.style.display=on?'block':'none';if(on)cur=s});
  if(cur){const k=io(p(t,cur.t0,cur.t1-cur.t0));const z=cur.z||[1.05,1.2],dx=cur.dx||0,dy=cur.dy||0;
    cur.m.style.transform=`scale(${z[0]+(z[1]-z[0])*k}) translate(${dx*(k-.5)}px,${dy*(k-.5)}px)`}
  let fl=0;D.shots.forEach(s=>{if(s.t0>0&&t>=s.t0&&t<s.t0+.3)fl+=.3*Math.exp(-(t-s.t0)*14)});$('flash').style.opacity=cl(fl);
  ctx.clearRect(0,0,1080,1920);ctx.fillStyle='rgba(255,255,255,.85)';
  for(const f of FL){const y=(f.y+f.v*t)%1960-20,x=f.x+Math.sin(t*1.3+f.w)*30;ctx.globalAlpha=.4+f.r/12;ctx.beginPath();ctx.arc(x,y,f.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  const bk=eo(p(t,0,.5));$('brand').style.opacity=t>=D.end?0:bk;
  let seg=null;for(const g of D.segs)if(t>=g.t0&&t<g.t1)seg=g;
  if(seg){$('tk').textContent=seg.k;$('th').innerHTML=seg.h;const k=back(p(t,seg.t0+.08,.45)),out=p(t,seg.t1-.2,.2);
    $('title').style.opacity=cl(p(t,seg.t0+.08,.15))*(1-out);$('title').style.transform=`scale(${.85+.15*k})`}else $('title').style.opacity=0;
  const on=t>=D.opt[0]&&t<D.opt[1];$('opt').style.display=on?'block':'none';
  if(on){const h=eo(p(t,D.opt[0],.4));$('oH').style.opacity=h;$('oH').style.transform=`translateY(${(1-h)*-40}px)`;
    [['oA',D.oa],['oB',D.ob]].forEach(([id,t0],i)=>{const k=eo(p(t,t0,.5));$(id).style.opacity=k;$(id).style.transform=`translateX(${(1-k)*(i?600:-600)}px)`});
    $('or').style.opacity=eo(p(t,D.ob-.2,.3))}
  const e=t>=D.end;$('end').style.display=e?'block':'none';
  if(e){const kl=back(p(t,D.end,.6));$('elogo').style.opacity=cl(p(t,D.end,.2));$('elogo').style.transform=`scale(${.6+.4*kl})`;
    [['e1',.3],['e3',1.2]].forEach(([id,d])=>{const k=eo(p(t,D.end+d,.5));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*40}px)`});
    const k2=back(p(t,D.url,.45));$('e2').style.opacity=cl(p(t,D.url,.15));$('e2').style.transform=`scale(${(.7+.3*k2)*(t>D.url+.6?1+.03*Math.sin((t-D.url)*5):1)})`}
  $('prog').style.width=(cl(t/T)*100)+'%';
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){const k=back(p(t,c.s,.18));html=`<div style="transform:scale(${.8+.2*k});opacity:${cl(p(t,c.s,.08))}">`+c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${esc(w.text)}</span>`).join(' ')+'</div>';break}}
  $('caps').innerHTML=html;
};
window.addEventListener('load',()=>document.fonts.ready.then(()=>render(0)));
</script>
</body>
</html>
