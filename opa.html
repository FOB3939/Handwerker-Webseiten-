<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- FOB reel "Schlagen ist keine Reparatur" – cut-out animation of the reference image.
     Render:  python3 make_opa.py            (MP4 -> jobs/opa/Opa_Spuelung_Hammer.mp4)
     Preview: python3 -m http.server 8000  ->  http://localhost:8000/opa.html?data=jobs/opa/data.js&play=1 -->
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#world{position:absolute;left:0;top:0;width:941px;height:1672px;transform-origin:0 0}
.L,.G{position:absolute;left:0;top:0}
.G{width:941px;height:1672px}
svg.ov{position:absolute;left:0;top:0;width:941px;height:1672px;overflow:visible}
.box{position:absolute;display:none;z-index:10;text-align:center}
.tb{left:612px;width:440px;top:250px;background:rgba(255,255,255,.93);border-radius:30px;padding:24px 26px;box-shadow:0 18px 44px rgba(60,40,10,.25);font:800 50px Montserrat;line-height:1.15;color:#1d2a3a}
.pow{position:absolute;display:none;z-index:9;font:700 70px Oswald;color:#fff;-webkit-text-stroke:5px #1d2a3a;paint-order:stroke;letter-spacing:.02em}
#end{position:absolute;inset:0;display:none;z-index:20;background:rgba(20,28,40,.78)}
#end .c{position:absolute;left:70px;right:70px;text-align:center;color:#fff}
#prog{position:absolute;left:0;top:0;height:8px;background:#ffb020;z-index:30}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
<script src="jobs/opa/layers/layers.js"></script>
</head>
<body>
<div id="stage">
 <div id="cam"><div id="world">
  <img class="L" id="base" src="jobs/opa/layers/base.jpg">
  <svg class="ov" id="water"></svg>
  <div class="G" id="hamBack"></div>
  <img class="L" id="body" src="jobs/opa/layers/body.png">
  <div class="G" id="headG"><img class="L" id="head" src="jobs/opa/layers/head.png"><img class="L" id="browN" src="jobs/opa/layers/browN.png"><img class="L" id="browF" src="jobs/opa/layers/browF.png"><svg class="ov" id="face"></svg></div>
  <div class="G" id="plateG"><img class="L" id="plate" src="jobs/opa/layers/plate.png"><svg class="ov" id="gap"></svg></div>
  <img class="L" id="piece" src="jobs/opa/layers/piece.png">
  <div class="G" id="armG"><div class="G" id="hamFront"></div><img class="L" id="arm" src="jobs/opa/layers/arm.png"></div>
  <svg class="ov" id="fx"></svg>
 </div></div>
 <div class="box tb" id="t1">Wenn gutes Zureden nicht mehr hilft …</div>
 <div class="box tb" id="t2">Wasser läuft.<br><span style="color:#e04848">Platte hin.</span></div>
 <div class="pow" id="pow"></div>
 <div id="end">
  <div class="c" id="e1" style="top:560px;font:700 108px Oswald;line-height:1.05">Schlagen ist<br>keine Reparatur.<br><span style="font-size:96px">🔨❌</span></div>
  <div class="c" id="e2" style="top:1010px;font:800 54px Montserrat;line-height:1.2"><span style="background:#ffb020;color:#1d2a3a;padding:10px 22px;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone">Bei laufender Spülung:<br>Ursache prüfen lassen.</span></div>
  <div class="c" id="e3" style="top:1270px;font:700 70px Oswald;color:#ffb020">fob-fm.de</div>
 </div>
 <div id="prog"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const S=1080/941, T=CUES.total, B=LAYERS.boxes;
const ew='#f6f1ea', sk=`rgb(${LAYERS.skin.join(',')})`, INK='#1d2a3a';
// place cut-out layers at their original pixel boxes
['head','body','arm','browN','browF','plate','piece'].forEach(k=>{const e=$(k);e.style.left=B[k][0]+'px';e.style.top=B[k][1]+'px'});
$('world').style.transform=`scale(${S})`;
// pivots (original pixel coordinates)
const NECK=[420,440], SHOULDER=[484,560], PL=B.plate, PIECE=B.piece;
// --- face overlay: redrawn eyes so they can blink, widen and look around ---
$('face').innerHTML=`
 <defs><clipPath id="cN"><ellipse id="eNc" cx="441" cy="356" rx="15" ry="13"/></clipPath><clipPath id="cF"><ellipse id="eFc" cx="488" cy="334" rx="8" ry="13"/></clipPath></defs>
 <ellipse id="eN" cx="441" cy="356" rx="15" ry="13" fill="${ew}"/><g clip-path="url(#cN)"><circle id="pN" cx="452" cy="357" r="6.5" fill="#1b1410"/><circle id="hN" cx="454" cy="354" r="2" fill="#fff"/><rect id="lN" x="420" y="330" width="44" height="0" fill="${sk}"/></g>
 <ellipse id="eF" cx="488" cy="334" rx="8" ry="13" fill="${ew}"/><g clip-path="url(#cF)"><circle id="pF" cx="492" cy="336" r="4.5" fill="#1b1410"/><rect id="lF" x="476" y="318" width="26" height="0" fill="${sk}"/></g>
 <ellipse id="blush" cx="468" cy="392" rx="20" ry="9" fill="#ff6b6b" opacity="0"/><ellipse id="blush2" cx="408" cy="380" rx="16" ry="8" fill="#ff6b6b" opacity="0"/>
 <path id="sweat" d="M0 0 q -9 16 0 20 q 9 -4 0 -20z" fill="#8fd3ff" stroke="#3a6e99" stroke-width="2" opacity="0"/>`;
// --- hammer (drawn), held in the fist; a copy lives behind the body for the "hide it" gag ---
const hammer=id=>`<svg class="ov" id="${id}"><g id="${id}g"><rect x="-9" y="-150" width="18" height="190" rx="8" fill="#a8743f" stroke="${INK}" stroke-width="4"/>
 <rect x="-62" y="-205" width="124" height="70" rx="16" fill="#8d99a6" stroke="${INK}" stroke-width="5"/><rect x="-62" y="-205" width="124" height="18" rx="8" fill="#b8c2cc"/></g></svg>`;
$('hamFront').innerHTML=hammer('hF');$('hamBack').innerHTML=hammer('hB');
// --- water overlay in the bowl ---
let wv='';for(let k=0;k<4;k++)wv+=`<ellipse id="rp${k}" cx="640" cy="1064" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="3"/>`;
$('water').innerHTML=wv+`<path id="stream" d="M688 1040 q -6 14 -2 30" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>
 <g id="wavy" opacity="0"><path d="M600 1000 q 12 -10 24 0 t 24 0 M640 980 q 12 -10 24 0 t 24 0" stroke="#5aa9ff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
// --- timeline (seconds) ---
const K={roll:3.0,p1:4.0,p2:4.4,p3:4.8,stop:5.0,happy:5.3,leave:7.0,resume:7.6,turn:7.9,zoom:8.7,zoomOut:9.9,ham:10.2,raise:10.5,swing:11.6,hit:11.85,hide:15.0,t2:15.2,end:17.0};
const water=t=>t<K.stop||t>=K.resume;
const AK=[[0,0,0,0],[3.0,0,0,0],[3.4,-24,0,6],[3.88,-24,0,6],[4.0,18,0,-2],[4.15,-24,0,6],[4.28,-24,0,6],[4.4,18,0,-2],[4.55,-24,0,6],[4.68,-24,0,6],[4.8,18,0,-2],[4.95,-24,0,6],
 [5.3,-24,0,6],[5.7,-30,40,14],[10.2,-30,40,14],[10.9,-10,-45,-12],[11.6,-10,-47,-13],[11.85,-14,-6,4],[12.7,10,40,30],[15.0,10,40,30],[15.6,-20,60,22],[99,-20,60,22]];
function armPose(t){let i=0;while(i<AK.length-2&&t>=AK[i+1][0])i++;const a=AK[i],b=AK[i+1];const k=(b[0]-a[0])<.2?p(t,a[0],b[0]-a[0]):io(p(t,a[0],b[0]-a[0]));
  let dx=lerp(a[1],b[1],k),dy=lerp(a[2],b[2],k),r=lerp(a[3],b[3],k)+Math.sin(t*1.7)*.6;
  if(t>=3.0&&t<3.85)r+=Math.sin((t-3.0)*34)*2.5;            // sleeve tug
  if(t>=5.7&&t<6.6)r+=Math.sin(t*28)*3.5;                   // dusting off the hands
  return [dx,dy,r]}
function render0(t){
  // camera: punch-in on the face, shake on the hammer hit
  let cz=1,cx=0,cy=0;
  const zin=io(p(t,K.zoom,.45))*(1-io(p(t,K.zoomOut,.45)));cz=1+.95*zin;
  const fx=455*S,fy=345*S;
  let sh=0;if(t>=K.hit&&t<K.hit+.45)sh=Math.sin((t-K.hit)*70)*14*(1-p(t,K.hit,.45));
  // pan the face toward the centre, clamped so the image always covers the frame
  let cpx=(540-fx)*zin,cpy=(780-fy)*zin;
  const ctop=fy-fy*cz+cpy,cleft=fx-fx*cz+cpx;
  if(ctop>0)cpy-=ctop;if(cleft>0)cpx-=cleft;
  $('cam').style.transform=`translate(${sh+cpx}px,${sh*.6+cpy}px) translate(${fx}px,${fy}px) scale(${cz}) translate(${-fx}px,${-fy}px)`;
  // body: subtle breathing (scaled from the feet)
  $('body').style.transformOrigin='300px 900px';$('body').style.transform=`scaleY(${1+.004*Math.sin(t*2.2)})`;
  // head
  let hr=Math.sin(t*1.3)*1.2,hx=0,hy=Math.sin(t*2.2)*1.5;
  if(t>=K.roll&&t<K.stop)hr+=-2*eo(p(t,K.roll,.4));                       // determined lean
  if(t>=K.happy&&t<K.leave)hr+=-5*eo(p(t,K.happy,.4))+Math.sin(t*9)*1.2*p(t,K.happy,.3); // proud head tilt
  if(t>=K.leave&&t<K.turn+.8){hr+=lerp(-5,4,eo(p(t,K.leave,.5)));hx-=10*eo(p(t,K.leave,.5))} // turns away to leave
  if(t>=K.turn){const k=io(p(t,K.turn,.9));hr+=lerp(4,0,k);hx-=lerp(10,0,k)}             // slowly turns back
  if(t>=K.zoom&&t<K.zoomOut){hr+=-3*back(p(t,K.zoom+.1,.3))}                            // double take
  if(t>=K.hit&&t<K.hit+.6)hr+=Math.sin((t-K.hit)*40)*2*(1-p(t,K.hit,.6));
  if(t>=K.hide){hr+=3*eo(p(t,K.hide,.6))}                                                  // sheepish tilt
  $('headG').style.transformOrigin=`${NECK[0]}px ${NECK[1]}px`;$('headG').style.transform=`translate(${hx}px,${hy}px) rotate(${hr}deg)`;
  // eyes: look direction, size, lids
  let look=1,wide=1,lid=0,lidF=0;
  const blink=[1.6,6.3,13.6,16.4].some(b=>t>=b&&t<b+.14)?1:0;
  if(t>=K.roll&&t<K.stop)lid=.35;                         // determined squint
  if(t>=K.happy&&t<K.leave)lid=.55;                        // happy squint
  if(t>=K.leave&&t<K.resume)look=-.6;                       // looks away (leaving)
  if(t>=K.turn)look=lerp(-.6,1,io(p(t,K.turn,.9)));
  if(t>=K.zoom&&t<K.ham){wide=1+.28*back(p(t,K.zoom+.1,.35));lid=0}
  if(t>=K.raise&&t<K.swing)lid=.45;                        // dramatic focus
  if(t>=K.hit&&t<K.hide){wide=1.15}
  if(t>=K.hide){look=-1.2;lid=.25}                          // glances to camera
  lid=Math.max(lid,blink);
  [['eN',441,356,15,13,'pN',6.5,11,'lN'],['eF',488,334,8,13,'pF',4.5,4,'lF']].forEach(([e,x,y,rx,ry,pp,pr,off,l])=>{
    $(e).setAttribute('rx',rx*wide);$(e).setAttribute('ry',ry*wide);$(e+'c').setAttribute('rx',rx*wide);$(e+'c').setAttribute('ry',ry*wide);
    $(pp).setAttribute('cx',x+off*look);$(pp).setAttribute('r',pr*(wide>1.1?.85:1));
    $(l).setAttribute('y',y-ry*wide-2);$(l).setAttribute('height',(2*ry*wide+4)*lid)});
  $('hN').setAttribute('cx',441+11*look+2);
  // brows (cut from the image, now movable)
  let by=0,br=0;
  if(t>=K.roll&&t<K.stop){by=4;br=8}                      // frown: determined
  if(t>=K.happy&&t<K.leave){by=-4;br=-4}
  if(t>=K.zoom&&t<K.ham){by=-12*back(p(t,K.zoom+.1,.35));br=-6}
  if(t>=K.raise&&t<K.swing){by=5;br=10}
  if(t>=K.hide){by=-6;br=-8}
  $('browN').style.transformOrigin='50% 50%';$('browN').style.transform=`translate(0,${by}px) rotate(${br}deg)`;
  $('browF').style.transform=`translate(0,${by*.8}px) rotate(${-br*.6}deg)`;
  $('blush').setAttribute('opacity',t>=K.hide?.45*eo(p(t,K.hide+.2,.5)):0);$('blush2').setAttribute('opacity',t>=K.hide?.4*eo(p(t,K.hide+.2,.5)):0);
  const sw=t>=K.hide+.3;$('sweat').setAttribute('opacity',sw?1:0);$('sweat').setAttribute('transform',`translate(${392},${290+((t-K.hide)*30)%30})`);
  // arm + hammer
  const [ax,ay,ar]=armPose(t);const tf=`translate(${ax}px,${ay}px) rotate(${ar}deg)`;
  $('armG').style.transformOrigin=`${SHOULDER[0]}px ${SHOULDER[1]}px`;$('armG').style.transform=tf;
  const hamOn=t>=K.ham;const hk=back(p(t,K.ham,.35));
  const hr2=t<K.raise?-8:t<K.swing?lerp(-8,18,eo(p(t,K.raise,.5))):t<K.hit?lerp(18,62,io(p(t,K.swing,K.hit-K.swing))):lerp(62,25,eo(p(t,K.hit+.4,.6)));
  $('hFg').setAttribute('transform',`translate(652,548) rotate(${hr2}) scale(${hamOn?hk:0})`);
  if(t>=K.hide){const k=io(p(t,K.hide,.7));$('hamBack').style.transform='none';
    $('hBg').setAttribute('transform',`translate(${lerp(700,215,k)},${lerp(640,560,k)}) rotate(${lerp(-20,-12,k)}) scale(1)`)}
  $('hamFront').style.display=hamOn&&t<K.hide?'block':'none';$('hamBack').style.display=t>=K.hide?'block':'none';
  // flush plate: wobble on punches, hangs crooked after the hammer
  let pr=0,py=0;[K.p1,K.p2,K.p3].forEach(c=>{if(t>=c&&t<c+.5)pr+=Math.sin((t-c)*45)*3*(1-p(t,c,.5))});
  if(t>=K.hit){const k=back(p(t,K.hit,.35));pr+=9*k;py+=10*k}
  $('plateG').style.transformOrigin=`${PL[0]+10}px ${PL[1]+8}px`;$('plateG').style.transform=`translate(0,${py}px) rotate(${pr}deg)`;
  $('gap').innerHTML=t>=K.hit?`<rect x="${PIECE[0]}" y="${PIECE[1]}" width="${PIECE[2]-PIECE[0]}" height="${PIECE[3]-PIECE[1]}" rx="3" fill="#3b3f45"/>`:'';
  // falling plastic piece (bounces on the floor)
  const fall=t>=K.hit;const pc=$('piece');pc.style.display=fall?'block':'none';
  if(fall){const u=t-K.hit;let y,x=(PIECE[0])+u*60,rot=u*420;const g=2600,floor=1330-PIECE[1];
    const t1=Math.sqrt(2*floor/g);if(u<t1)y=.5*g*u*u;else{const v=g*t1*.35,u2=u-t1;y=Math.max(0,floor-(v*u2-.5*g*u2*u2));if(u2>2*v/g){y=floor;x=PIECE[0]+t1*60+ (2*v/g)*60;rot=t1*420+2*v/g*200}}
    pc.style.transform=`translate(${Math.min(x,PIECE[0]+90)-PIECE[0]}px,${Math.min(y,floor)+ (t>=K.hit?0:0)}px) rotate(${Math.min(rot,560)}deg)`}
  // water running in the bowl (+ pictogram so it reads without sound)
  const wOn=water(t);
  for(let k=0;k<4;k++){const ph=((t*1.2+k/4)%1);const e=$('rp'+k);e.setAttribute('rx',10+ph*60);e.setAttribute('ry',4+ph*16);e.setAttribute('opacity',wOn?(1-ph)*.75:0)}
  $('stream').setAttribute('opacity',wOn?.8:0);$('stream').setAttribute('d',`M688 1040 q ${-6+Math.sin(t*20)*3} 14 -2 30`);
  $('wavy').setAttribute('opacity',wOn?.9:0);$('wavy').setAttribute('transform',`translate(0,${-((t*40)%20)})`);
  // impact text
  const pw=$('pow');let ptxt='',px=0,py2=0,ps=0;
  [K.p1,K.p2,K.p3].forEach((c,i)=>{if(t>=c&&t<c+.35){ptxt='POCH!';px=700+i*40;py2=470-i*30;ps=back(p(t,c,.2))}});
  if(t>=K.hit&&t<K.hit+.9){ptxt='KRACK!';px=740;py2=420;ps=1.4*back(p(t,K.hit,.25))}
  if(t>=K.zoom+.15&&t<K.zoomOut){ptxt='?!';px=650;py2=230;ps=1.8*back(p(t,K.zoom+.15,.3))}
  pw.style.display=ptxt?'block':'none';pw.textContent=ptxt;pw.style.left=px+'px';pw.style.top=py2+'px';pw.style.transform=`scale(${ps}) rotate(-8deg)`;
  // texts
  const b1=t>=.25&&t<K.roll-.1;$('t1').style.display=b1?'block':'none';if(b1){$('t1').style.transform=`scale(${back(p(t,.25,.4))})`;$('t1').style.opacity=1-p(t,K.roll-.35,.25)}
  const b2=t>=K.t2&&t<K.end;$('t2').style.display=b2?'block':'none';if(b2)$('t2').style.transform=`scale(${back(p(t,K.t2,.4))})`;
  // end card
  const inE=t>=K.end;$('end').style.display=inE?'block':'none';
  if(inE){$('end').style.opacity=eo(p(t,K.end,.4));[['e1',.15],['e2',.6],['e3',1.0]].forEach(([id,d])=>{const k=back(p(t,K.end+d,.45));$(id).style.opacity=cl(p(t,K.end+d,.15));$(id).style.transform=`scale(${k})`})}
  $('prog').style.width=(cl(t/T)*100)+'%';
}
window.render=async function(t){render0(t);await Promise.all([...document.querySelectorAll('img')].map(x=>x.decode().catch(()=>{})))};
window.addEventListener('load',()=>document.fonts.ready.then(()=>{render0(0);
  if(new URLSearchParams(location.search).get('play')){const t0=performance.now();const loop=()=>{render0(((performance.now()-t0)/1000)%T);requestAnimationFrame(loop)};loop()}}));
</script>
</body>
</html>
