<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
:root{--r:#ff4d5a;--tq:#2ee6d6;--y:#ffd23f;--ink:#071631}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#061430}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:linear-gradient(180deg,#0b2350 0%,#0a1f44 55%,#061430 100%)}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:70px;right:70px;text-align:center}
#head{top:200px;font:700 88px Oswald;white-space:nowrap;line-height:1;text-transform:uppercase;text-shadow:0 7px 0 #5a0a14,0 16px 40px rgba(0,0,0,.5)}
#card{top:1060px;display:none}
#card .c{display:inline-flex;align-items:center;gap:26px;text-align:left;background:rgba(12,32,70,.94);border:5px solid var(--tq);border-radius:30px;padding:22px 34px;max-width:920px}
#card .n{flex:none;width:110px;height:110px;border-radius:50%;background:var(--tq);color:var(--ink);font:700 76px Oswald;display:flex;align-items:center;justify-content:center}
#card .m{font:800 54px Montserrat;line-height:1.1}
#card .s{font:600 36px Montserrat;color:#b8c8ea;margin-top:8px}
#caps{position:absolute;left:90px;right:150px;top:1440px;text-align:center;z-index:20}
#caps div{display:inline-block;background:rgba(5,14,36,.9);border:3px solid rgba(46,230,214,.55);border-radius:20px;padding:12px 28px;font:800 54px Montserrat;line-height:1.16;max-width:840px}
#caps span.on{color:var(--y)}
#end{position:absolute;inset:0;display:none;background:#061430}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage">
<svg id="sv" viewBox="0 0 1080 1920"></svg>
<div class="t" id="head"></div>
<div class="t" id="card"><div class="c"><div class="n" id="cn">1</div><div><div class="m" id="cm"></div><div class="s" id="cs"></div></div></div></div>
<div id="caps"></div>
<div id="end"><div class="t" id="e0" style="top:700px;font-size:120px">🔖</div><div class="t" id="e1" style="top:860px;font:800 72px Montserrat;line-height:1.1">Haustechnik<br>einfach erklärt</div><div class="t" id="e2" style="top:1090px;font:700 110px Oswald;color:var(--y)">fob-fm.de</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const C=CUES,T=C.total,INK='#071631';
const A=(id,k,v)=>$(id).setAttribute(k,v);
let drops='';for(let k=0;k<34;k++)drops+=`<circle id="d${k}" r="${6+(k%3)*3}" fill="#5cc8ff"/>`;
$('sv').innerHTML=`
<defs><clipPath id="pc"><rect x="70" y="340" width="940" height="660" rx="30"/></clipPath></defs>
<g clip-path="url(#pc)">
 <rect x="70" y="340" width="940" height="660" fill="#1d3b6c"/>
 <rect x="70" y="900" width="940" height="100" fill="#26497f"/>
 <rect id="pud" x="70" y="1000" width="940" height="0" fill="#3fa9ff" opacity=".55"/>
 <!-- wall pipe -->
 <rect x="270" y="340" width="40" height="560" fill="#8a96a8" stroke="${INK}" stroke-width="6"/>
 <path id="crack" d="M262 520 l20 10 l-12 12 l26 8" stroke="${INK}" stroke-width="6" fill="none"/>
 <g id="spray">${drops}</g>
 <!-- water meter + main valve -->
 <g id="meter" transform="translate(190,800)"><rect x="-120" y="-16" width="240" height="32" fill="#8a96a8" stroke="${INK}" stroke-width="6"/>
  <circle cx="-30" r="54" fill="#e9eef3" stroke="${INK}" stroke-width="7"/><circle cx="-30" r="36" fill="#fff" stroke="#9fb0c4" stroke-width="4"/><line id="mneedle" x1="-30" y1="0" x2="-30" y2="-28" stroke="${RED='#ff4d5a'}" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(70,-16)"><rect x="-8" y="-34" width="16" height="34" fill="${INK}"/><ellipse id="wheel" cy="-40" rx="46" ry="15" fill="#e04848" stroke="${INK}" stroke-width="6"/></g>
  <text x="-100" y="96" text-anchor="start" font-family="Montserrat" font-weight="800" font-size="30" fill="#ffd23f" id="mlab" opacity="0">Wasserzähler + Haupthahn</text></g>
 <circle id="spot1" cx="190" cy="790" r="150" fill="none" stroke="#ffd23f" stroke-width="8" stroke-dasharray="20 14" opacity="0"/>
 <!-- fuse box -->
 <g id="fuse" transform="translate(850,520)"><rect x="-90" y="-110" width="180" height="220" rx="16" fill="#e9eef3" stroke="${INK}" stroke-width="7"/>
  <rect x="-60" y="-70" width="34" height="70" rx="6" fill="#c9d3de" stroke="${INK}" stroke-width="5"/><rect x="-14" y="-70" width="34" height="70" rx="6" fill="#c9d3de" stroke="${INK}" stroke-width="5"/>
  <g id="lev" transform="translate(49,-35)"><rect x="-17" y="-35" width="34" height="70" rx="6" fill="#c9d3de" stroke="${INK}" stroke-width="5"/><rect id="levk" x="-12" y="-30" width="24" height="26" rx="5" fill="#2bd67b"/></g>
  <text y="80" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="40" fill="${INK}">⚡</text></g>
 <circle id="spot2" cx="850" cy="520" r="160" fill="none" stroke="#ffd23f" stroke-width="8" stroke-dasharray="20 14" opacity="0"/>
 <rect id="dark" x="70" y="340" width="940" height="660" fill="#000" opacity="0"/>
 <g id="warn" opacity="0" transform="translate(560,870)"><rect x="-300" y="-50" width="600" height="100" rx="50" fill="#ffd23f" stroke="${INK}" stroke-width="6"/><text text-anchor="middle" y="16" font-family="Montserrat" font-weight="800" font-size="42" fill="${INK}">⚠️ Nicht im Wasser stehen!</text></g>
 <!-- phone -->
 <g id="phone" transform="translate(1400,660)"><rect x="-150" y="-280" width="300" height="560" rx="44" fill="#0d1631" stroke="#3a4a7a" stroke-width="10"/>
  <g id="cam"><rect x="-128" y="-240" width="256" height="400" rx="18" fill="#26497f"/><rect x="-128" y="40" width="256" height="120" fill="#3fa9ff" opacity=".6"/><rect x="-14" y="-240" width="28" height="400" fill="#8a96a8"/>
   <path d="M-110 -222 h40 M-110 -222 v40 M110 -222 h-40 M110 -222 v40 M-110 142 h40 M-110 142 v-40 M110 142 h-40 M110 142 v-40" stroke="#fff" stroke-width="6"/><circle cy="214" r="34" fill="#fff" stroke="#ccc" stroke-width="6"/><circle id="rec" cx="90" cy="-200" r="12" fill="#ff4d5a"/></g>
  <g id="call" opacity="0"><circle cy="-120" r="70" fill="#2ee6d6"/><text y="-96" text-anchor="middle" font-size="70">🔧</text><text id="callt" y="10" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="34" fill="#fff">Fachbetrieb</text>
   <text id="calls" y="56" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="26" fill="#9fb4d8">wird angerufen …</text><circle cy="200" r="44" fill="#2bd67b"/><text y="218" text-anchor="middle" font-size="44">📞</text></g>
  <rect id="shut" x="-128" y="-240" width="256" height="400" rx="18" fill="#fff" opacity="0"/></g>
 <!-- magnifier for "today" -->
 <g id="mag" opacity="0"><circle r="110" fill="rgba(191,233,255,.18)" stroke="#fff" stroke-width="16"/><line x1="78" y1="78" x2="170" y2="170" stroke="#fff" stroke-width="28" stroke-linecap="round"/></g>
</g>
<rect id="frame" x="70" y="340" width="940" height="660" rx="30" fill="none" stroke="#ff4d5a" stroke-width="10" opacity="0"/>`;
const CH=[];{let cur=[];CAPS.forEach((w,k)=>{cur.push(w);const txt=cur.map(x=>x.text).join(' ');const brk=/[.,?!:;]$/.test(w.text)||cur.length>=5||txt.length>28;if(brk||k===CAPS.length-1){CH.push(cur);cur=[]}});}
CH.forEach((c,k)=>{c.s=c[0].start-.05;c.e=k+1<CH.length?Math.min(CH[k+1][0].start-.05,c[c.length-1].end+.6):c[c.length-1].end+.5});
const STEPS=[[C.erst,'1','Hauptabsperrhahn zu','meist beim Wasserzähler','WASSER ZU'],[C.zweit,'2','Elektrik betroffen? Sicherung raus','nicht im Wasser stehen','STROM AUS'],
 [C.dritt,'3','Fotos & Videos machen','wichtig für die Versicherung','DOKUMENTIEREN'],[C.viert,'4','Fachbetrieb anrufen','+ Vermieter / Hausverwaltung informieren','MELDEN']];
window.render=async function(t){
  const E=C.endc;
  // header
  const h=$('head');let st=null;STEPS.forEach(s=>{if(t>=s[0])st=s});
  if(t<C.erst){h.innerHTML='Rohrbruch! <span style="color:#ff8f8f">Was jetzt?</span>';h.style.transform=`scale(${back(p(t,.05,.4))}) rotate(${Math.sin(t*22)*1.5*(1-p(t,1,1))}deg)`}
  else if(t<C.und){h.innerHTML=`<span style="color:#2ee6d6">${st[1]}</span> · ${st[4]}`;h.style.transform=`scale(${back(p(t,st[0],.4))})`}
  else{h.innerHTML='Heute schon <span style="color:#ffd23f">nachsehen</span>';h.style.transform=`scale(${back(p(t,C.und,.4))})`}
  // burst: spray until valve closed
  const off=eo(p(t,C.hah+.4,1.0));const spray=cl(p(t,.1,.3))*(1-off);
  for(let k=0;k<34;k++){const ph=((t*1.3+k/34)%1);const ang=-.5+(k%7)*.12;const v=520+(k%5)*60;const x=300+Math.cos(ang)*v*ph,y=525+Math.sin(ang)*v*ph+600*ph*ph;
    A('d'+k,'cx',x);A('d'+k,'cy',y);A('d'+k,'opacity',spray*(1-ph))}
  A('pud','y',1000-Math.min(70,eo(p(t,.2,C.hah))*70));A('pud','height',Math.min(70,eo(p(t,.2,C.hah))*70));
  A('frame','opacity',t<C.erst?(.5+.5*Math.sin(t*8))*.8:0);
  // step 1
  A('spot1','opacity',t>=C.erst&&t<C.zweit?1:0);A('wheel','rx',t>=C.hah?46*Math.abs(Math.cos(p(t,C.hah,1)*Math.PI*3))+6:46);
  A('mneedle','transform',`rotate(${t<C.hah+1.4?t*400:(C.hah+1.4)*400} -30 0)`);A('mlab','opacity',t>=C.zaehl&&t<C.zweit?1:0);
  // step 2
  A('spot2','opacity',t>=C.zweit&&t<C.dritt?1:0);const lv=eo(p(t,C.sich,.35));A('lev','transform',`translate(49,-35)`);A('levk','y',lerp(-30,4,lv));A('levk','fill',lv>.5?'#ff4d5a':'#2bd67b');
  A('dark','opacity',t>=C.sich&&t<C.dritt?.35*lv:0);
  const wk=back(p(t,C.aber,.4));A('warn','opacity',t>=C.aber&&t<C.dritt?1:0);A('warn','transform',`translate(560,870) scale(${wk})`);
  // step 3 + 4: phone
  const ph=t>=C.dritt&&t<C.und;const pk=eo(p(t,C.dritt,.5))*(1-eo(p(t,C.und-.3,.4)));A('phone','transform',`translate(${lerp(1400,800,pk)},660)`);
  A('cam','opacity',t<C.viert?1:0);A('call','opacity',t>=C.viert?1:0);A('rec','opacity',t>=C.videos&&t<C.viert&&Math.sin(t*8)>0?1:0);
  let sh=0;[C.fotos,C.videos].forEach(c=>{if(t>=c&&t<c+.3)sh=.5*(1-p(t,c,.3))});A('shut','opacity',sh);
  $('callt').textContent=t>=C.verm?'Vermieter / HV':'Fachbetrieb';$('calls').textContent=t>=C.verm?'informieren …':'wird angerufen …';
  if(t>=C.viert)A('call','transform',`rotate(${Math.sin(t*30)*2*(Math.sin(t*3)>0?1:0)})`);
  // today: magnifier finds the main valve
  const mg=t>=C.und&&t<E;A('mag','opacity',mg?1:0);if(mg){const k=eo(p(t,C.und,1.2));A('mag','transform',`translate(${lerp(700,260,k)},${lerp(520,770,k)}) scale(${.8+.2*Math.sin(t*4)*.2+.2})`)}
  A('spot1','opacity',(t>=C.erst&&t<C.zweit)||t>=C.haupt2?1:0);
  // card
  const cd=$('card');const showC=st&&t<C.und;cd.style.display=showC?'block':(t>=C.speich&&t<E?'block':'none');
  if(showC){$('cn').textContent=st[1];$('cm').textContent=st[2];$('cs').textContent=st[3];$('cs').style.opacity=t>=st[0]+.9?1:0;cd.style.transform=`translateX(${(1-back(p(t,st[0],.45)))*-900}px)`;cd.firstChild.style.borderColor='#2ee6d6'}
  else if(t>=C.speich){$('cn').textContent='🔖';$('cm').textContent='Speichern für den Notfall';$('cs').textContent='und teilen mit Familie & Nachbarn';$('cs').style.opacity=1;cd.style.transform=`scale(${back(p(t,C.speich,.4))})`;cd.firstChild.style.borderColor='#ffd23f'}
  // end
  const inE=t>=E;$('end').style.display=inE?'block':'none';
  if(inE)[['e0',.1],['e1',.3],['e2',.7]].forEach(([id,d])=>{const k=eo(p(t,E+d,.6));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*30}px)`});
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){html=c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${w.text}</span>`).join(' ');break}}
  $('caps').innerHTML=t<E&&html?`<div>${html}</div>`:'';
};
window.addEventListener('load',()=>document.fonts.ready.then(()=>render(0)));
</script>
</body>
</html>
