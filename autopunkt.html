<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(assets/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(assets/fonts/oswald-latin-700-normal.woff2)}
:root{--r:#D8141B;--r2:#FF3B3F;--ink:#0c0c0f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:#0c0c0f}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.a{position:absolute}
.c{left:50px;right:50px;text-align:center}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.bgb{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(36px) brightness(.35)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.85) 100%)}
#logo{left:90px;width:900px;border-radius:26px;box-shadow:0 30px 90px rgba(216,20,27,.35),0 20px 60px rgba(0,0,0,.6)}
.streak{position:absolute;height:10px;border-radius:5px;background:linear-gradient(90deg,transparent,var(--r2),#fff,var(--r2),transparent);box-shadow:0 0 30px var(--r2)}
.bar{display:inline-block;background:var(--r);padding:14px 34px;font:800 64px Montserrat;text-transform:uppercase;line-height:1.05;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.k{font:800 34px Montserrat;letter-spacing:.24em;text-transform:uppercase;color:#fff;opacity:.85}
.seal{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff4a4f,var(--r) 60%,#8c0c10);border:10px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.seal .big{font:700 170px Oswald;line-height:.9}
.seal .t{font:800 36px Montserrat;text-transform:uppercase;line-height:1.1;padding:0 30px}
.card{position:absolute;width:460px;height:250px;background:rgba(15,15,18,.88);border:3px solid rgba(255,255,255,.12);border-left:12px solid var(--r);border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card .i{font-size:72px;line-height:1}
.card .t{font:800 40px Montserrat;line-height:1.1;margin-top:12px}
#pin{left:440px;top:700px;width:200px;height:260px}
#addr{left:90px;right:90px;top:1000px;text-align:center}
#addr div{display:inline-block;white-space:nowrap;background:#fff;color:var(--ink);font:800 46px Montserrat;padding:22px 40px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#caps{position:absolute;left:50px;right:50px;top:1580px;text-align:center;z-index:20}
#caps div{display:inline-block;background:rgba(12,12,15,.9);border-radius:18px;padding:12px 28px;font:800 54px Montserrat;line-height:1.16}
#caps span.on{color:var(--r2)}
#flash{position:absolute;inset:0;background:#fff;z-index:30;opacity:0}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--r);z-index:31}
#wipe{position:absolute;top:-20%;height:140%;width:60%;left:-80%;background:var(--r);transform:skewX(-14deg);z-index:29}
</style>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('data')||'data.js')+'"><\/script>')</script>
</head>
<body>
<div id="stage"><div id="cam">

<div class="sc" id="S1">
  <div class="streak" id="st1" style="top:640px;width:900px"></div><div class="streak" id="st2" style="top:1180px;width:700px"></div>
  <img class="a" id="logo" src="jobs/autopunkt/img/logo.jpg" style="top:720px">
  <div class="a c k" id="k1" style="top:1260px">Automobilhändler · Glonn</div>
</div>

<div class="sc" id="S2"><div id="mont"></div><div class="shade"></div>
  <div class="a c" id="t2" style="top:300px"><span class="bar">An- &amp; Verkauf</span><br><span class="bar" style="background:#fff;color:var(--ink);font-size:52px;margin-top:10px">von Gebrauchtwagen</span></div>
</div>

<div class="sc" id="S3"><div class="bgb" style="background-image:url(jobs/autopunkt/img/amg_front.jpg)"></div>
  <div class="seal" id="se1" style="left:60px;top:520px"><div class="t" style="font-size:30px">bis zu</div><div class="big">24</div><div class="t">Monate<br>Garantie</div></div>
  <div class="seal" id="se2" style="left:600px;top:860px"><div class="big" style="font-size:150px">€</div><div class="t">Finanzierung<br><span style="font-size:28px">zu fairen Konditionen</span></div></div>
</div>

<div class="sc" id="S4"><div class="bgb" style="background-image:url(jobs/autopunkt/img/showroom2.jpg)"></div>
  <div class="a c" id="t4" style="top:290px"><span class="bar">Rund ums Auto</span></div>
  <div id="cards"></div>
</div>

<div class="sc" id="S5"><div class="ph" id="sr1" style="background-image:url(jobs/autopunkt/img/showroom1.jpg)"></div><div class="ph" id="sr2" style="background-image:url(jobs/autopunkt/img/showroom2.jpg);opacity:0"></div><div class="shade"></div>
  <div class="a c" id="t5" style="top:300px"><span class="bar">Unser Showroom</span></div>
  <svg class="a" id="pin" viewBox="0 0 200 260"><path d="M100 250 C 40 160 10 120 10 90 a90 90 0 0 1 180 0 c0 30 -30 70 -90 160z" fill="#D8141B" stroke="#fff" stroke-width="8"/><circle cx="100" cy="90" r="34" fill="#fff"/></svg>
  <div class="a" id="addr"><div>📍 Kastenseestraße 6 · Glonn</div></div>
</div>

<div class="sc" id="S6" style="background:radial-gradient(circle at 50% 40%,#2a0b0d,#0c0c0f 70%)">
  <img class="a" id="logo2" src="jobs/autopunkt/img/logo.jpg" style="left:90px;width:900px;top:520px;border-radius:26px;box-shadow:0 30px 90px rgba(216,20,27,.35)">
  <div class="a c" id="e1" style="top:930px;font:800 76px Montserrat;text-transform:uppercase">Wir freuen uns<br><span style="color:var(--r2)">auf Sie!</span></div>
  <div class="a c" id="e2" style="top:1150px;font:800 52px Montserrat">@autopunkt.glonn</div>
  <div class="a c" id="e3" style="top:1235px;font:600 40px Montserrat;color:#ddd">Kastenseestraße 6 · Glonn</div>
</div>

</div>
<div id="wipe"></div><div id="caps"></div><div id="flash"></div><div id="prog"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.8;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const C=CUES,T=C.total,IMG='jobs/autopunkt/img/';
const SC=[['S1',0,C.s2],['S2',C.s2,C.s3],['S3',C.s3,C.s4],['S4',C.s4,C.s5],['S5',C.s5,C.s6],['S6',C.s6,T]];
const CUTS=[C.s2,C.s3,C.s4,C.s5,C.s6];
const MON=[['amg_front','50% 60%'],['bmw_x3','50% 50%'],['amg_cockpit','50% 50%'],['vw_bus','50% 50%'],['bmw_front','50% 50%'],['amg_rear','45% 50%'],['key','50% 50%']];
const PRE=[...MON.map(m=>m[0]),'showroom1','showroom2','logo'].map(n=>{const i=new Image();i.src=IMG+n+'.jpg';return i});
MON.forEach(m=>{const d=document.createElement('div');d.className='ph';d.style.backgroundImage=`url(${IMG}${m[0]}.jpg)`;d.style.backgroundPosition=m[1];$('mont').appendChild(d);m.el=d});
const SV=[['📋','Zulassungs­dienst'],['✨','Smart Repair'],['🔨','Dellen ohne Lackieren'],['🚗','Unfall­instandsetzung'],['🪟','Autoglas'],['🔑','Hol- & Bring­service']];
SV.forEach((s,i)=>{const d=document.createElement('div');d.className='card';d.style.left=(60+(i%2)*500)+'px';d.style.top=(450+Math.floor(i/2)*300)+'px';d.innerHTML=`<div class="i">${s[0]}</div><div class="t">${s[1]}</div>`;$('cards').appendChild(d);s.el=d});
const CH=[];{let cur=[];CAPS.forEach((w,k)=>{cur.push(w);const brk=/[.,?!:;–]$/.test(w.text)||cur.length>=4||cur.map(x=>x.text).join(' ').length>22;if(brk||k===CAPS.length-1){CH.push(cur);cur=[]}});}
CH.forEach((c,k)=>{c.s=c[0].start;c.e=k+1<CH.length?Math.min(CH[k+1][0].start,c[c.length-1].end+.5):c[c.length-1].end+.8});
window.render=async function(t){
  SC.forEach(([id,a,b])=>$(id).style.display=(t>=a&&t<b)?'block':'none');
  let sx=0,sy=0,zs=1;for(const c of [...CUTS,...C.svc,C.gar,C.fin]){if(t>=c&&t<c+.45){const k=Math.exp(-(t-c)*9);sx+=Math.sin((t-c)*83)*14*k;sy+=Math.cos((t-c)*71)*10*k;zs+=.04*k}}
  $('cam').style.transform=`translate(${sx}px,${sy}px) scale(${zs})`;
  let fl=0;for(const c of CUTS)if(t>=c)fl+=.3*Math.exp(-(t-c)*12);$('flash').style.opacity=cl(fl);
  // red wipe across scene cuts
  let wk=-1;for(const c of CUTS){const d=t-c;if(d>-.3&&d<.3)wk=(d+.3)/.6}
  $('wipe').style.left=wk>=0?(-70+200*io(wk))+'%':'-80%';
  $('prog').style.width=(cl(t/T)*100)+'%';
  // S1 logo
  {const k=back(p(t,.35,.6));$('logo').style.opacity=cl(p(t,.35,.15));$('logo').style.transform=`scale(${.6+.4*k}) rotate(${(1-k)*-4}deg)`;
   $('st1').style.left=(-950+2200*io(p(t,0,.9)))+'px';$('st2').style.left=(1100-2000*io(p(t,.15,.9)))+'px';
   const kk=eo(p(t,1.1,.5));$('k1').style.opacity=kk;$('k1').style.transform=`translateY(${(1-kk)*30}px)`;
   $('logo').style.filter=`drop-shadow(0 0 ${20+10*Math.sin(t*4)}px rgba(216,20,27,.5))`}
  // S2 montage
  {const n=MON.length,d=(C.s3-C.s2)/n;MON.forEach((m,i)=>{const t0=C.s2+i*d,on=t>=t0&&t<t0+d;m.el.style.display=on?'block':'none';if(on){const k=p(t,t0,d);m.el.style.transform=`scale(${1.25-.12*eo(k)}) translateX(${(i%2?1:-1)*40*(1-k)}px)`}});
   const k=back(p(t,C.s2+.1,.45));$('t2').style.opacity=cl(p(t,C.s2+.1,.1));$('t2').style.transform=`translateX(${(1-k)*-700}px)`}
  // S3 seals
  {[['se1',C.gar,-1],['se2',C.fin,1]].forEach(([id,ti,s])=>{const k=back(p(t,ti,.5));$(id).style.opacity=cl(p(t,ti,.1));$(id).style.transform=`scale(${k}) rotate(${(1-k)*200*s+Math.sin(t*2)*3}deg)`})}
  // S4 services
  {const k=back(p(t,C.s4,.4));$('t4').style.transform=`scale(${k})`;SV.forEach((s,i)=>{const ti=C.svc[i];const kk=back(p(t,ti,.4));s.el.style.opacity=cl(p(t,ti,.08));s.el.style.transform=`translateX(${(1-kk)*(i%2?700:-700)}px) rotate(${(1-kk)*(i%2?8:-8)}deg)`})}
  // S5 showroom + pin
  {const d=C.s6-C.s5,k=p(t,C.s5,d);$('sr1').style.transform=`scale(${1.05+.12*k})`;$('sr2').style.transform=`scale(${1.15-.1*k})`;$('sr2').style.opacity=eo(p(t,C.s5+d*.5,.6));
   const kt=back(p(t,C.s5+.1,.4));$('t5').style.transform=`scale(${kt})`;
   const kp=back(p(t,C.kast-.2,.5));$('pin').style.opacity=cl(p(t,C.kast-.2,.1));$('pin').style.transform=`translateY(${(1-kp)*-500}px)`;
   const ka=back(p(t,C.kast+.2,.4));$('addr').style.opacity=cl(p(t,C.kast+.2,.1));$('addr').style.transform=`scale(${ka})`}
  // S6 end
  {const t0=C.s6;const kl=back(p(t,t0,.5));$('logo2').style.opacity=cl(p(t,t0,.15));$('logo2').style.transform=`scale(${.6+.4*kl})`;
   [['e1',.4],['e2',.9],['e3',1.2]].forEach(([id,d])=>{const k=eo(p(t,t0+d,.45));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*40}px)`})}
  let html='';for(const c of CH){if(t>=c.s&&t<c.e){const k=back(p(t,c.s,.16));html=`<div style="transform:scale(${.75+.25*k});opacity:${cl(p(t,c.s,.06))}">`+c.map(w=>`<span class="${t>=w.start-.03?'on':''}">${esc(w.text)}</span>`).join(' ')+'</div>';break}}
  $('caps').innerHTML=t>=C.s6?'':html;
  await Promise.all(PRE.map(i=>i.decode().catch(()=>{})));
};
window.addEventListener('load',()=>document.fonts.ready.then(()=>render(0)));
</script>
</body>
</html>
